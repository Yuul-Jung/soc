name: SoC07 original PDF figure extraction
on:
  push:
    paths:
      - .github/workflows/soc07-original-figures.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - run: python -m pip install pymupdf pillow
      - name: Fetch original PDFs and extract figure regions without redrawing
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request, fitz
          from PIL import Image
          root=pathlib.Path("MicroBlaze_V_SoC01_41/images/soc07/vendor")
          root.mkdir(parents=True, exist_ok=True)
          sources={
            "amd": ["https://docs.amd.com/api/khub/documents/dB1MAeh~uLG7FE62a5_QbA/content",
                    "https://hthreads.github.io/modules/eecs-4114/data-sheets/pg142-axi-uartlite.pdf"],
            "digilent": ["https://digilent.com/reference/_media/reference/programmable-logic/basys-3/basys3_rm.pdf",
                         "https://physics.umd.edu/hep/drew/programmable/basys3_rm.pdf"]
          }
          figs=[
            ("digilent",7,"digilent_fig06_basys3_uart.png","Digilent Figure 6",(.29,.685,.72,.83),"FT2232"),
            ("amd",5,"pg142_fig01_01_axi_uartlite.png","PG142 Figure 1-1",(.16,.29,.90,.57),"UART"),
            ("amd",9,"pg142_table02_04_registers.png","PG142 Table 2-4",(.15,.445,.93,.595),"Register"),
            ("amd",9,"pg142_fig02_01_rx_fifo.png","PG142 Figure 2-1",(.16,.765,.91,.875),"FIFO"),
            ("amd",10,"pg142_fig02_02_tx_fifo.png","PG142 Figure 2-2",(.16,.35,.91,.495),"FIFO"),
            ("amd",10,"pg142_fig02_03_control.png","PG142 Figure 2-3",(.16,.735,.91,.885),"Control"),
            ("amd",11,"pg142_fig02_04_status.png","PG142 Figure 2-4",(.16,.53,.91,.74),"Status"),
            ("amd",15,"pg142_fig04_01_vivado_gui.png","PG142 Figure 4-1",(.16,.14,.90,.655),"Vivado"),
            ("amd",18,"pg142_fig05_01_example_design.png","PG142 Figure 5-1",(.19,.455,.89,.815),"Design"),
            ("amd",21,"pg142_fig06_01_testbench.png","PG142 Figure 6-1",(.22,.39,.88,.765),"Bench")
          ]
          docs={}; records={}
          for key, urls in sources.items():
            errors=[]
            for url in urls:
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/pdf,*/*"})
                with urllib.request.urlopen(req,timeout=45) as resp: data=resp.read()
                if not data.startswith(b"%PDF") or len(data)<10000: raise ValueError("Not PDF")
                doc=fitz.open(stream=data,filetype="pdf")
                if doc.page_count!=(26 if key=="amd" else 19): raise ValueError("PDF page count mismatch")
                docs[key]=doc
                records[key]={"url":url,"sha256":hashlib.sha256(data).hexdigest(),"pages":doc.page_count}
                print("SOURCE OK:",key,url,records[key]["sha256"]);break
              except Exception as e:
                errors.append(str(e))
            else: raise RuntimeError("Cannot download source "+key+": "+"; ".join(errors))
          images=[]
          for key,page_num,filename,figure,frac,caption_token in figs:
            p=docs[key][page_num-1];x0,y0,x1,y1=frac
            if key=="digilent":
              # Figure location changed across the official manual revisions.
              hits=p.search_for("Figure 6.") or p.search_for("Figure 6")
              if not hits:raise RuntimeError("Cannot find Digilent Figure 6 caption")
              cap=hits[0]
              rect=fitz.Rect(p.rect.x0+.20*p.rect.width,
                   max(p.rect.y0,cap.y0-.15*p.rect.height),
                   p.rect.x0+.80*p.rect.width,
                   min(p.rect.y1,cap.y1+.035*p.rect.height))
            else:
              rect=fitz.Rect(p.rect.x0+x0*p.rect.width,p.rect.y0+y0*p.rect.height,
                             p.rect.x0+x1*p.rect.width,p.rect.y0+y1*p.rect.height)
            text=p.get_text("text",clip=rect)
            if caption_token.lower() not in text.lower():
              raise RuntimeError("Figure caption or key term missing: "+figure+"; "+text[:300])
            pic=p.get_pixmap(matrix=fitz.Matrix(2.8,2.8),clip=rect,alpha=False)
            png=pic.tobytes("png")
            if len(png)<5000 or pic.width<300 or pic.height<120:
              raise RuntimeError("Bad crop: "+figure)
            target=root/filename;target.write_bytes(png)
            with Image.open(target) as im:
              colors=im.convert("RGB").getcolors(maxcolors=500000)
              if colors is not None and len(colors)<10:raise RuntimeError("Blank crop "+figure)
            images.append({"figure":figure,"file":filename,"page":page_num,"source":key,
                           "fraction":frac,"sha256":hashlib.sha256(png).hexdigest(),
                           "pixels":[pic.width,pic.height]})
            print("FIGURE OK:",figure,filename,pic.width,pic.height,len(png))
          (root/"manifest.json").write_text(json.dumps({"source":records,"figures":images,
            "method":"Unmodified raster crops of official PDF figures, no redraw"},indent=2)+"\n")
          if len(images)!=10:raise RuntimeError("Incomplete figures")
          PY
      - name: Commit only original figure crops and manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MicroBlaze_V_SoC01_41/images/soc07/vendor/
          if ! git diff --cached --quiet; then
            git commit -m "SoC07: extract original vendor PDF figure crops"
            git push origin HEAD:main
          fi
