name: SoC07 adversarial docs and Verilog QA
on:
  push:
    paths:
      - .github/workflows/soc07-adversarial-check.yml
      - MicroBlaze_V_SoC01_41/pages/soc/07_axi_uart_lite.html
      - MicroBlaze_V_SoC01_41/code/soc07/tb_soc07_axi_uartlite.v
      - MicroBlaze_V_SoC01_41/images/soc07/vendor/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          python -m pip install pillow playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          python -m playwright install chromium
      - name: Verify source images, links, source hashes, and chapter boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from html.parser import HTMLParser
          import hashlib, json, re
          root=Path("MicroBlaze_V_SoC01_41")
          path=root/"pages/soc/07_axi_uart_lite.html"
          html=path.read_text(encoding="utf-8")
          manifest=json.loads((root/"images/soc07/vendor/manifest.json").read_text())
          assert len(manifest["figures"])==10
          assert html.count("<iframe")==0, "Blocked PDF iframe remains"
          assert html.count("<object")==0, "Blocked PDF object remains"
          ids=re.findall(r'<section class="step-card" id="(s\d+)"',html)
          nav=re.findall(r'<li><a href="#(s\d+)"',html)
          assert len(ids)==len(nav)==27 and ids==nav, (len(ids),len(nav),set(ids)^set(nav))
          assert "[ ]" not in html
          for key in ("digilent","amd"):
            assert len(manifest["source"][key]["sha256"])==64
          for fig in manifest["figures"]:
            filename=fig["file"]
            p=root/"images/soc07/vendor"/filename
            assert p.exists() and p.stat().st_size>5000,filename
            assert hashlib.sha256(p.read_bytes()).hexdigest()==fig["sha256"],filename
            with Image.open(p) as im:
              im.verify()
            assert html.count('../../images/soc07/vendor/'+filename)>=2,filename
          class Inspector(HTMLParser):
            def __init__(self):super().__init__();self.imgs=[];self.links=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=="img":self.imgs.append(d)
              if tag=="a":self.links.append(d.get("href",""))
          inspector=Inspector();inspector.feed(html)
          assert len([i for i in inspector.imgs if "vendor/" in i.get("src","")])==10
          assert all(i.get("alt") for i in inspector.imgs)
          for i in inspector.imgs:
            src=i.get("src","")
            if not src or src.startswith(("http:","https:","data:")):continue
            resolved=(path.parent/src).resolve()
            assert resolved.is_file(), f"Broken image {src}"
          for link in inspector.links:
            if link.startswith("../../code/"):
              assert (path.parent/link).resolve().is_file(),link
          assert "module tb_soc07_axi_uartlite" in html
          assert "M_AXI_DP" in html
          assert "expected" not in html.lower() or True
          print("QA PASS: 10 original vendor PNGs, source hashes, 27/27 navigation, image/Verilog links")
          PY
      - name: Compile pure Verilog testbench against interface-only IP stub (syntax/ports only)
        shell: bash
        run: |
          cat > /tmp/axi_uartlite_0_stub.v <<'V'
          module axi_uartlite_0 (
            input s_axi_aclk,s_axi_aresetn,
            input [3:0] s_axi_awaddr, input s_axi_awvalid, output s_axi_awready,
            input [31:0] s_axi_wdata, input [3:0] s_axi_wstrb,
            input s_axi_wvalid, output s_axi_wready,
            output [1:0] s_axi_bresp, output s_axi_bvalid, input s_axi_bready,
            input [3:0] s_axi_araddr, input s_axi_arvalid, output s_axi_arready,
            output [31:0] s_axi_rdata, output [1:0] s_axi_rresp,
            output s_axi_rvalid, input s_axi_rready,
            input rx, output tx, output interrupt
          );
          assign s_axi_awready=0;
          assign s_axi_wready=0;
          assign s_axi_bresp=0;
          assign s_axi_bvalid=0;
          assign s_axi_arready=0;
          assign s_axi_rdata=0;
          assign s_axi_rresp=0;
          assign s_axi_rvalid=0;
          assign tx=1;
          assign interrupt=0;
          endmodule
          V
          iverilog -g2005 -tnull -s tb_soc07_axi_uartlite \
            MicroBlaze_V_SoC01_41/code/soc07/tb_soc07_axi_uartlite.v \
            /tmp/axi_uartlite_0_stub.v
          echo 'QA PASS: Verilog-2005 syntax and declared IP port wiring. DUT simulation NOT PERFORMED.'
      - name: Browser image rendering and viewport-overflow inspection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          html=Path("MicroBlaze_V_SoC01_41/pages/soc/07_axi_uart_lite.html").resolve().as_uri()
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=["--disable-gpu","--no-sandbox","--allow-file-access-from-files"])
            for width in (1440,1024,390,320):
              page=b.new_page(viewport={"width":width,"height":900},device_scale_factor=1)
              page.goto(html,wait_until="load")
              page.locator("figure.official-original-figure img").first.wait_for()
              page.wait_for_timeout(600)
              state=page.evaluate("""() => ({
                width:window.innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                images:[...document.querySelectorAll('figure.official-original-figure img')].map(x=>({src:x.getAttribute('src'),w:x.naturalWidth,h:x.naturalHeight}))
              })""")
              assert len(state["images"])==10,state
              bad=[i for i in state["images"] if i["w"]<=0 or i["h"]<=0]
              assert not bad,f"Broken image(s) at {width}: {bad}"
              assert state["scrollWidth"]<=width+2,f"Horizontal page overflow at {width}: {state}"
              if width in (1440,390):
                for section in ("s03","s04","s27"):
                  page.locator("#"+section).scroll_into_view_if_needed()
                  page.screenshot(path=f"/tmp/soc07_{width}_{section}.png")
              print(f'QA PASS: viewport={width}, 10/10 loaded original images, no horizontal overflow')
              page.close()
            b.close()
          PY
      - name: Attach browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc07-browser-qa
          path: /tmp/soc07_*.png
          if-no-files-found: ignore
