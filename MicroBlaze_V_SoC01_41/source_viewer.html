<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Basys3 MicroBlaze V SoC 실습 소스를 UTF-8로 정확하게 표시합니다.">
<title>실습 소스 보기 · Basys3 SoC 01~41</title>
<link rel="stylesheet" href="00_overview/overview.css">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;color:#222b40;font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;line-height:1.7}
.viewer-shell{width:min(1460px,calc(100% - 32px));margin:30px auto}
.viewer-panel{background:white;border:1px solid #e0e4ed;border-radius:15px;box-shadow:0 3px 24px #1b255014;overflow:hidden}
.viewer-header{padding:25px 27px 22px;border-bottom:1px solid #e1e4eb}
.viewer-back{display:inline-block;margin-bottom:15px;color:#4833aa;text-decoration:none;font-weight:700}
.viewer-header h1{margin:0 0 7px;font-size:clamp(1.25rem,2.5vw,1.8rem);line-height:1.4;overflow-wrap:anywhere}
.viewer-header p{margin:0;color:#5c6679}
.viewer-path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9rem;overflow-wrap:anywhere}
.viewer-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 26px;background:#f7f8fc;border-bottom:1px solid #e0e4ed}
.viewer-tools a,.viewer-tools button{display:inline-block;cursor:pointer;padding:9px 15px;border:1px solid #6255c3;border-radius:8px;background:white;color:#3f318f;font:inherit;font-size:.94rem;font-weight:600;text-decoration:none}
.viewer-tools button{background:#4334a8;color:#fff}
.viewer-tools a:focus-visible,.viewer-tools button:focus-visible{outline:3px solid #9c8df5;outline-offset:2px}
#status{margin-left:auto;color:#59627a;font-size:.9rem}
#code{margin:0;padding:25px 28px;min-height:190px;max-height:76vh;overflow:auto;white-space:pre;tab-size:4;font-family:"D2Coding","Noto Sans Mono CJK KR",Consolas,"Liberation Mono",monospace;font-size:14px;line-height:1.65;color:#20273a;background:#fff}
.viewer-footer{padding:12px 27px;background:#f7f8fc;border-top:1px solid #e3e6ed;font-size:.88rem;color:#657084}
.viewer-error{color:#a52233!important;white-space:pre-wrap!important}
@media(max-width:700px){.viewer-shell{width:100%;margin:0}.viewer-panel{border-radius:0}.viewer-header{padding:20px 16px}.viewer-tools{padding:12px 16px}#code{padding:18px 15px;font-size:12px}#status{width:100%;margin-left:0}}
</style>
</head>
<body>
<main class="viewer-shell">
<section class="viewer-panel" aria-label="실습 소스 파일">
<header class="viewer-header">
<a href="index.html" class="viewer-back">← SoC 01~41 전체 목차</a>
<h1 id="filename">실습 소스 보기</h1>
<p class="viewer-path" id="file-path">파일 경로 확인 중…</p>
</header>
<div class="viewer-tools">
<button id="copy" type="button" disabled>전체 코드 복사</button>
<a id="download" href="index.html" download>원본 파일 저장</a>
<a id="raw" href="index.html" target="_blank" rel="noopener">원본 주소</a>
<span id="status" role="status" aria-live="polite">파일을 읽는 중…</span>
</div>
<pre id="code" tabindex="0">UTF-8 인코딩으로 원본 파일을 읽고 있습니다.</pre>
<footer class="viewer-footer">이 페이지는 파일의 바이트를 UTF-8로 해석하여 표시합니다. 원본 Verilog · C · XDC · Markdown 파일은 변경하지 않습니다.</footer>
</section>
</main>
<script>
(async function () {
  'use strict';
  const el = id => document.getElementById(id);
  const file = new URLSearchParams(location.search).get('file') || '';
  const bad = !/^(code|docs|validation)\/[A-Za-z0-9_.\/-]+$/.test(file)
      || file.split('/').some(part => part === '..' || part === '.' || !part)
      || !/\.(?:v|vh|sv|svh|c|h|py|tcl|xdc|sh|md|txt|json|xml|csv|log|S|hex|mem|coe|yml|yaml)$/i.test(file);
  function fail(message) {
    el('code').classList.add('viewer-error');
    el('code').textContent = message;
    el('status').textContent = '파일 표시 실패';
  }
  if (bad) {
    el('filename').textContent = '파일 경로를 확인하세요';
    el('file-path').textContent = file || '파일 미선택';
    el('download').hidden = true;
    el('raw').hidden = true;
    fail('실습 자료에 포함된 유효한 소스 경로만 열 수 있습니다.');
    return;
  }
  const name = file.split('/').pop();
  const url = new URL(file, document.baseURI);
  el('filename').textContent = name;
  el('file-path').textContent = file;
  el('download').href = url.href;
  el('download').download = name;
  el('raw').href = url.href;
  document.title = name + ' · 실습 소스 보기';
  try {
    const response = await fetch(url, {cache:'no-cache'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const bytes = await response.arrayBuffer();
    const source = new TextDecoder('utf-8', {fatal:true}).decode(bytes);
    el('code').textContent = source;
    el('status').textContent = 'UTF-8 · ' + source.split('\n').length.toLocaleString('ko-KR') + '줄 · ' + bytes.byteLength.toLocaleString('ko-KR') + '바이트';
    el('copy').disabled = false;
    el('copy').addEventListener('click', async () => {
      let copied = false;
      try { if(navigator.clipboard && window.isSecureContext) {await navigator.clipboard.writeText(source); copied = true;} } catch (error) {}
      if (!copied) {
        const t = document.createElement('textarea');
        t.value = source; t.style.position = 'fixed'; t.style.left = '-99999px';
        document.body.appendChild(t); t.select();
        try { copied = document.execCommand('copy'); } catch(error){}
        t.remove();
      }
      if(copied) {el('status').textContent = '원본 소스 전체 복사 완료'; return;}
      const select = document.createRange();select.selectNodeContents(el('code'));
      window.getSelection().removeAllRanges();window.getSelection().addRange(select);
      el('status').textContent = '코드를 선택했습니다. Ctrl+C로 복사하세요.';
    });
  } catch (error) {
    fail('원본 파일을 표시할 수 없습니다. 서버와 문자 인코딩을 확인하거나 [원본 파일 저장]을 사용하세요.\n' + error.message +
      (location.protocol === 'file:' ? '\n오프라인 file:// 환경에서는 브라우저가 fetch를 차단할 수 있습니다. 파일을 직접 열거나 로컬 HTTP 서버를 사용하세요.' : ''));
  }
})();
</script>
</body>
</html>
