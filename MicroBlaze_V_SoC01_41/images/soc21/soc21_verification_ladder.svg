<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650">
<rect width="1280" height="650" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">검증 성숙도: Waveform → Automated Verification</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<g font-family="sans-serif">
<rect x="55" y="180" width="185" height="135" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="148" y="220" text-anchor="middle" font-size="18" font-weight="bold">1. Waveform</text>
<text x="148" y="257" text-anchor="middle" font-size="15">사람이 파형 확인</text>
<text x="148" y="287" text-anchor="middle" font-size="15">초기 Debug</text>

<rect x="290" y="160" width="185" height="175" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="383" y="200" text-anchor="middle" font-size="18" font-weight="bold">2. Self-Checking</text>
<text x="383" y="237" text-anchor="middle" font-size="15">Expected vs Actual</text>
<text x="383" y="267" text-anchor="middle" font-size="15">자동 PASS/FAIL</text>
<text x="383" y="297" text-anchor="middle" font-size="15">Scoreboard</text>

<rect x="525" y="140" width="185" height="215" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="618" y="180" text-anchor="middle" font-size="18" font-weight="bold">3. Assertion</text>
<text x="618" y="217" text-anchor="middle" font-size="15">Protocol Invariant</text>
<text x="618" y="247" text-anchor="middle" font-size="15">Temporal Rule</text>
<text x="618" y="277" text-anchor="middle" font-size="15">Illegal Sequence</text>
<text x="618" y="317" text-anchor="middle" font-size="15">SVA</text>

<rect x="760" y="120" width="185" height="255" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="853" y="160" text-anchor="middle" font-size="18" font-weight="bold">4. Coverage</text>
<text x="853" y="197" text-anchor="middle" font-size="15">무엇을 검증했는가?</text>
<text x="853" y="227" text-anchor="middle" font-size="15">Functional Coverage</text>
<text x="853" y="257" text-anchor="middle" font-size="15">Code Coverage</text>
<text x="853" y="297" text-anchor="middle" font-size="15">Coverage Hole</text>
<text x="853" y="337" text-anchor="middle" font-size="15">Regression</text>

<rect x="995" y="100" width="225" height="295" rx="12" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="1108" y="140" text-anchor="middle" font-size="18" font-weight="bold">5. UVM</text>
<text x="1108" y="177" text-anchor="middle" font-size="15">Sequence Item</text>
<text x="1108" y="207" text-anchor="middle" font-size="15">Driver / Monitor</text>
<text x="1108" y="237" text-anchor="middle" font-size="15">Scoreboard</text>
<text x="1108" y="267" text-anchor="middle" font-size="15">Coverage Collector</text>
<text x="1108" y="297" text-anchor="middle" font-size="15">Constrained Random</text>
<text x="1108" y="337" text-anchor="middle" font-size="15">Reusable Environment</text>
</g>
<g stroke="#111827" stroke-width="3" marker-end="url(#a)">
<line x1="240" y1="248" x2="290" y2="248"/>
<line x1="475" y1="248" x2="525" y2="248"/>
<line x1="710" y1="248" x2="760" y2="248"/>
<line x1="945" y1="248" x2="995" y2="248"/>
</g>
<text x="640" y="490" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">SoC 21의 위치</text>
<text x="640" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">Self-Checking + Assertion + Coverage를 완성하고, UVM은 필요할 때 이 구조를 Class 기반으로 확장한다.</text>
<text x="640" y="580" text-anchor="middle" font-family="sans-serif" font-size="16">UVM을 쓰는 것 자체가 목표가 아니라 검증 자산의 재사용성과 확장성이 목표다.</text>
</svg>