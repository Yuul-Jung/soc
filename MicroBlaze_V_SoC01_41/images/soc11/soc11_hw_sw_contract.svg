<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520">
<rect width="1240" height="520" fill="white"/>
<text x="620" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Register Map = Hardware / Software Contract</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="70" y="150" width="260" height="190" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/><text x="200" y="198" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Software</text><text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-size="18">Base + Offset</text><text x="200" y="276" text-anchor="middle" font-family="sans-serif" font-size="18">Mask / Shift</text><text x="200" y="312" text-anchor="middle" font-family="sans-serif" font-size="18">Xil_In32 / Xil_Out32</text>
<rect x="490" y="110" width="260" height="270" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/><text x="620" y="158" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Register Map</text><text x="620" y="205" text-anchor="middle" font-family="sans-serif" font-size="18">Offset</text><text x="620" y="241" text-anchor="middle" font-family="sans-serif" font-size="18">Access Type</text><text x="620" y="277" text-anchor="middle" font-family="sans-serif" font-size="18">Bit Field</text><text x="620" y="313" text-anchor="middle" font-family="sans-serif" font-size="18">Reset Value</text><text x="620" y="349" text-anchor="middle" font-family="sans-serif" font-size="18">Side Effect</text>
<rect x="910" y="150" width="260" height="190" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/><text x="1040" y="198" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">RTL</text><text x="1040" y="240" text-anchor="middle" font-family="sans-serif" font-size="18">Register Storage</text><text x="1040" y="276" text-anchor="middle" font-family="sans-serif" font-size="18">Pulse / Status</text><text x="1040" y="312" text-anchor="middle" font-family="sans-serif" font-size="18">Hardware Event</text>
<line x1="330" y1="245" x2="490" y2="245" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><line x1="750" y1="245" x2="910" y2="245" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="620" y="460" text-anchor="middle" font-family="sans-serif" font-size="17">Offset나 Bit 의미를 한쪽만 바꾸면 Software와 Hardware가 즉시 불일치한다.</text>
</svg>