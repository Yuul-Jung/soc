<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650">
<rect width="1280" height="650" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Custom AXI4-Lite Slave 구조</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="60" y="115" width="270" height="410" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="195" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">AXI4-Lite Master</text>
<text x="195" y="205" text-anchor="middle" font-family="sans-serif" font-size="18">AW · Write Address</text>
<text x="195" y="250" text-anchor="middle" font-family="sans-serif" font-size="18">W · Write Data / WSTRB</text>
<text x="195" y="295" text-anchor="middle" font-family="sans-serif" font-size="18">B · Write Response</text>
<text x="195" y="365" text-anchor="middle" font-family="sans-serif" font-size="18">AR · Read Address</text>
<text x="195" y="410" text-anchor="middle" font-family="sans-serif" font-size="18">R · Read Data / Response</text>

<rect x="445" y="90" width="350" height="455" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="620" y="135" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">axi4lite_slave_adapter</text>
<rect x="490" y="180" width="260" height="115" fill="white" stroke="#111827"/>
<text x="620" y="215" text-anchor="middle" font-family="sans-serif" font-size="18">AW Buffer</text>
<text x="620" y="245" text-anchor="middle" font-family="sans-serif" font-size="18">W Buffer</text>
<text x="620" y="275" text-anchor="middle" font-family="sans-serif" font-size="17">둘 다 확보 → wr_en 1 Clock</text>
<rect x="490" y="340" width="260" height="110" fill="white" stroke="#111827"/>
<text x="620" y="377" text-anchor="middle" font-family="sans-serif" font-size="18">AR Handshake</text>
<text x="620" y="407" text-anchor="middle" font-family="sans-serif" font-size="17">rd_data Latch</text>
<text x="620" y="437" text-anchor="middle" font-family="sans-serif" font-size="17">RVALID 유지</text>

<rect x="900" y="125" width="300" height="390" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1050" y="170" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">custom_register_bank</text>
<text x="1050" y="220" text-anchor="middle" font-family="monospace" font-size="17">wr_en / wr_offset</text>
<text x="1050" y="255" text-anchor="middle" font-family="monospace" font-size="17">wr_data / wr_strb</text>
<text x="1050" y="325" text-anchor="middle" font-family="monospace" font-size="17">rd_offset</text>
<text x="1050" y="360" text-anchor="middle" font-family="monospace" font-size="17">rd_data</text>
<text x="1050" y="430" text-anchor="middle" font-family="sans-serif" font-size="17">CONTROL / STATUS / COMMAND</text>
<text x="1050" y="463" text-anchor="middle" font-family="sans-serif" font-size="17">IRQ / DATA / VERSION / ID</text>

<line x1="330" y1="235" x2="445" y2="235" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="445" y1="285" x2="330" y2="285" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="330" y1="390" x2="445" y2="390" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="445" y1="440" x2="330" y2="440" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="795" y1="245" x2="900" y2="245" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="900" y1="360" x2="795" y2="360" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="850" y="225" text-anchor="middle" font-family="sans-serif" font-size="15">Write</text>
<text x="850" y="345" text-anchor="middle" font-family="sans-serif" font-size="15">Read</text>
<text x="640" y="610" text-anchor="middle" font-family="sans-serif" font-size="16">AXI Protocol 처리와 Register 동작을 분리한 구조</text>
