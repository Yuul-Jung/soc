<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
<rect width="1280" height="520" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">AW와 W는 독립 Channel</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="80" y="105" width="340" height="300" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="250" y="145" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Case A · AW 먼저</text>
<text x="250" y="195" text-anchor="middle" font-family="sans-serif" font-size="18">AWVALID ∧ AWREADY</text>
<text x="250" y="235" text-anchor="middle" font-family="sans-serif" font-size="17">Address Buffer 저장</text>
<text x="250" y="290" text-anchor="middle" font-family="sans-serif" font-size="18">나중에 WVALID ∧ WREADY</text>
<text x="250" y="330" text-anchor="middle" font-family="sans-serif" font-size="17">Data Buffer 저장</text>
<text x="250" y="375" text-anchor="middle" font-family="sans-serif" font-size="18">둘 다 존재 → Commit</text>

<rect x="470" y="105" width="340" height="300" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="640" y="145" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Case B · W 먼저</text>
<text x="640" y="195" text-anchor="middle" font-family="sans-serif" font-size="18">WVALID ∧ WREADY</text>
<text x="640" y="235" text-anchor="middle" font-family="sans-serif" font-size="17">Data Buffer 저장</text>
<text x="640" y="290" text-anchor="middle" font-family="sans-serif" font-size="18">나중에 AWVALID ∧ AWREADY</text>
<text x="640" y="330" text-anchor="middle" font-family="sans-serif" font-size="17">Address Buffer 저장</text>
<text x="640" y="375" text-anchor="middle" font-family="sans-serif" font-size="18">둘 다 존재 → Commit</text>

<rect x="860" y="105" width="340" height="300" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1030" y="145" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">공통 결과</text>
<text x="1030" y="205" text-anchor="middle" font-family="monospace" font-size="18">wr_en = 1 Clock</text>
<text x="1030" y="250" text-anchor="middle" font-family="monospace" font-size="18">wr_offset = AWADDR</text>
<text x="1030" y="295" text-anchor="middle" font-family="monospace" font-size="18">wr_data = WDATA</text>
<text x="1030" y="340" text-anchor="middle" font-family="monospace" font-size="18">wr_strb = WSTRB</text>
<text x="1030" y="385" text-anchor="middle" font-family="sans-serif" font-size="18">BVALID → BREADY까지 유지</text>
</svg>
