<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
<rect width="1280" height="500" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">AXI4-Lite Read와 Backpressure</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="80" y="150" width="210" height="125" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="185" y="200" text-anchor="middle" font-family="sans-serif" font-size="19">ARVALID</text>
<text x="185" y="235" text-anchor="middle" font-family="sans-serif" font-size="19">+ ARADDR</text>
<rect x="390" y="130" width="240" height="165" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="510" y="180" text-anchor="middle" font-family="sans-serif" font-size="19">ARREADY</text>
<text x="510" y="220" text-anchor="middle" font-family="sans-serif" font-size="17">Handshake</text>
<text x="510" y="255" text-anchor="middle" font-family="sans-serif" font-size="17">rd_data Latch</text>
<rect x="745" y="115" width="250" height="195" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="870" y="165" text-anchor="middle" font-family="sans-serif" font-size="19">RVALID = 1</text>
<text x="870" y="205" text-anchor="middle" font-family="sans-serif" font-size="18">RDATA 유지</text>
<text x="870" y="245" text-anchor="middle" font-family="sans-serif" font-size="18">RRESP = OKAY</text>
<text x="870" y="285" text-anchor="middle" font-family="sans-serif" font-size="17">RREADY가 올 때까지 유지</text>
<rect x="1065" y="150" width="145" height="125" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="1138" y="200" text-anchor="middle" font-family="sans-serif" font-size="19">RREADY</text>
<text x="1138" y="235" text-anchor="middle" font-family="sans-serif" font-size="18">Handshake</text>
<line x1="290" y1="212" x2="390" y2="212" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="630" y1="212" x2="745" y2="212" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="995" y1="212" x2="1065" y2="212" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="640" y="410" text-anchor="middle" font-family="sans-serif" font-size="18">RREADY가 늦어져도 RVALID와 RDATA는 바뀌면 안 됨</text>
</svg>
