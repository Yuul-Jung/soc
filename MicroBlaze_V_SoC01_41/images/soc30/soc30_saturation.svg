<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<rect width="1280" height="560" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Signed int8 Saturation</text>
<line x1="150" y1="280" x2="1130" y2="280" stroke="#111827" stroke-width="5"/>
<line x1="320" y1="245" x2="320" y2="315" stroke="#111827" stroke-width="4"/>
<line x1="960" y1="245" x2="960" y2="315" stroke="#111827" stroke-width="4"/>
<text x="320" y="225" text-anchor="middle" font-family="sans-serif" font-size="20">-128</text>
<text x="960" y="225" text-anchor="middle" font-family="sans-serif" font-size="20">+127</text>
<rect x="120" y="345" width="330" height="110" rx="12" fill="#fef2f2" stroke="#111827"/>
<text x="285" y="390" text-anchor="middle" font-family="sans-serif" font-size="18">x &lt; -128</text>
<text x="285" y="425" text-anchor="middle" font-family="sans-serif" font-size="18">→ -128</text>
<rect x="475" y="345" width="330" height="110" rx="12" fill="#f0fdf4" stroke="#111827"/>
<text x="640" y="390" text-anchor="middle" font-family="sans-serif" font-size="18">-128 ≤ x ≤ 127</text>
<text x="640" y="425" text-anchor="middle" font-family="sans-serif" font-size="18">→ 그대로 int8</text>
<rect x="830" y="345" width="330" height="110" rx="12" fill="#fef2f2" stroke="#111827"/>
<text x="995" y="390" text-anchor="middle" font-family="sans-serif" font-size="18">x &gt; 127</text>
<text x="995" y="425" text-anchor="middle" font-family="sans-serif" font-size="18">→ 127</text>
</svg>