<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<rect width="1280" height="620" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Signed 8-bit · Fractional Bits = 7</text>

<rect x="90" y="115" width="470" height="160" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="325" y="160" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Input Raw Value</text>
<text x="325" y="205" text-anchor="middle" font-family="sans-serif" font-size="17">real = raw / 2⁷</text>
<text x="325" y="245" text-anchor="middle" font-family="sans-serif" font-size="16">64 → +0.5 · -32 → -0.25</text>

<rect x="720" y="115" width="470" height="160" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="955" y="160" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Product Raw Value</text>
<text x="955" y="205" text-anchor="middle" font-family="sans-serif" font-size="17">fractional bits = 7 + 7 = 14</text>
<text x="955" y="245" text-anchor="middle" font-family="sans-serif" font-size="16">64 × -32 → -2048</text>

<rect x="405" y="355" width="470" height="155" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="640" y="400" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Accumulator Interpretation</text>
<text x="640" y="445" text-anchor="middle" font-family="sans-serif" font-size="17">real = acc_raw / 2¹⁴</text>
<text x="640" y="485" text-anchor="middle" font-family="sans-serif" font-size="16">-2048 / 16384 → -0.125</text>

<line x1="560" y1="195" x2="720" y2="195" stroke="#111827" stroke-width="4"/>
<line x1="955" y1="275" x2="760" y2="355" stroke="#111827" stroke-width="4"/>
<line x1="325" y1="275" x2="520" y2="355" stroke="#111827" stroke-width="4"/>

<text x="640" y="575" text-anchor="middle" font-family="sans-serif" font-size="16">Binary Point는 Hardware Register에 저장되는 별도 신호가 아니라 설계자가 정한 해석 규칙이다.</text>
</svg>