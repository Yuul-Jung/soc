<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600">
<rect width="1320" height="600" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">MAC · Multiply-Accumulate</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="70" y="190" width="200" height="120" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="170" y="235" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">a[n]</text>
<text x="170" y="275" text-anchor="middle" font-family="sans-serif" font-size="16">signed 8-bit</text>

<rect x="70" y="350" width="200" height="120" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="170" y="395" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">b[n]</text>
<text x="170" y="435" text-anchor="middle" font-family="sans-serif" font-size="16">signed 8-bit</text>

<circle cx="455" cy="330" r="90" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="455" y="315" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">×</text>
<text x="455" y="355" text-anchor="middle" font-family="sans-serif" font-size="16">16-bit product</text>

<circle cx="730" cy="330" r="90" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="730" y="315" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">+</text>
<text x="730" y="355" text-anchor="middle" font-family="sans-serif" font-size="16">accumulate</text>

<rect x="960" y="260" width="240" height="140" rx="12" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="1080" y="305" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Accumulator</text>
<text x="1080" y="345" text-anchor="middle" font-family="sans-serif" font-size="16">signed 32-bit</text>
<text x="1080" y="375" text-anchor="middle" font-family="sans-serif" font-size="16">Σ a[k]×b[k]</text>

<line x1="270" y1="250" x2="390" y2="300" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="270" y1="410" x2="390" y2="360" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="545" y1="330" x2="640" y2="330" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="820" y1="330" x2="960" y2="330" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<path d="M1080 400 L1080 510 L730 510 L730 420" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="660" y="565" text-anchor="middle" font-family="sans-serif" font-size="17">acc[n+1] = acc[n] + a[n] × b[n]</text>
</svg>