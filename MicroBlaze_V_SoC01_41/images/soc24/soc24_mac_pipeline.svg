<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="630" viewBox="0 0 1320 630">
<rect width="1320" height="630" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Basic MAC vs Pipelined MAC</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<text x="90" y="110" font-family="sans-serif" font-size="20" font-weight="bold">Basic</text>
<rect x="90" y="145" width="180" height="90" rx="10" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="180" y="200" text-anchor="middle" font-family="sans-serif" font-size="17">a, b</text>
<rect x="350" y="135" width="230" height="110" rx="10" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="465" y="180" text-anchor="middle" font-family="sans-serif" font-size="18">Multiply</text>
<text x="465" y="215" text-anchor="middle" font-family="sans-serif" font-size="15">8×8 → 16-bit</text>
<rect x="665" y="135" width="230" height="110" rx="10" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" font-family="sans-serif" font-size="18">Accumulator</text>
<text x="780" y="215" text-anchor="middle" font-family="sans-serif" font-size="15">32-bit feedback</text>
<line x1="270" y1="190" x2="350" y2="190" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="580" y1="190" x2="665" y2="190" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="90" y="365" font-family="sans-serif" font-size="20" font-weight="bold">Pipelined</text>
<rect x="90" y="400" width="180" height="90" rx="10" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="180" y="455" text-anchor="middle" font-family="sans-serif" font-size="17">a, b</text>
<rect x="335" y="390" width="200" height="110" rx="10" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="435" y="435" text-anchor="middle" font-family="sans-serif" font-size="18">Multiply</text>
<text x="435" y="470" text-anchor="middle" font-family="sans-serif" font-size="15">Stage 1</text>
<rect x="600" y="400" width="180" height="90" rx="10" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="690" y="455" text-anchor="middle" font-family="sans-serif" font-size="17">Product Reg</text>
<rect x="850" y="390" width="230" height="110" rx="10" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="965" y="435" text-anchor="middle" font-family="sans-serif" font-size="18">Accumulator</text>
<text x="965" y="470" text-anchor="middle" font-family="sans-serif" font-size="15">Stage 2</text>
<line x1="270" y1="445" x2="335" y2="445" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="535" y1="445" x2="600" y2="445" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="780" y1="445" x2="850" y2="445" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="660" y="570" text-anchor="middle" font-family="sans-serif" font-size="17">Pipeline은 Valid도 Data와 같은 Stage 수만큼 함께 이동시켜야 한다.</text>
</svg>