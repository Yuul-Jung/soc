<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="650" viewBox="0 0 1360 650">
<rect width="1360" height="650" fill="white"/>
<text x="680" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">4-Lane PE · Parallel MAC / Dot Product</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<g font-family="sans-serif">
<rect x="50" y="115" width="200" height="110" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="150" y="158" text-anchor="middle" font-size="18" font-weight="bold">Lane 0</text><text x="150" y="195" text-anchor="middle" font-size="15">a0 × b0</text>
<rect x="50" y="245" width="200" height="110" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="150" y="288" text-anchor="middle" font-size="18" font-weight="bold">Lane 1</text><text x="150" y="325" text-anchor="middle" font-size="15">a1 × b1</text>
<rect x="50" y="375" width="200" height="110" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="150" y="418" text-anchor="middle" font-size="18" font-weight="bold">Lane 2</text><text x="150" y="455" text-anchor="middle" font-size="15">a2 × b2</text>
<rect x="50" y="505" width="200" height="110" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="150" y="548" text-anchor="middle" font-size="18" font-weight="bold">Lane 3</text><text x="150" y="585" text-anchor="middle" font-size="15">a3 × b3</text>

<rect x="340" y="145" width="190" height="150" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="435" y="190" text-anchor="middle" font-size="19" font-weight="bold">Pair Sum 01</text>
<text x="435" y="235" text-anchor="middle" font-size="16">p0 + p1</text>
<text x="435" y="270" text-anchor="middle" font-size="15">signed 17 bit</text>

<rect x="340" y="405" width="190" height="150" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="435" y="450" text-anchor="middle" font-size="19" font-weight="bold">Pair Sum 23</text>
<text x="435" y="495" text-anchor="middle" font-size="16">p2 + p3</text>
<text x="435" y="530" text-anchor="middle" font-size="15">signed 17 bit</text>

<rect x="650" y="275" width="210" height="150" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="755" y="320" text-anchor="middle" font-size="20" font-weight="bold">Dot4 Sum</text>
<text x="755" y="365" text-anchor="middle" font-size="16">sum01 + sum23</text>
<text x="755" y="400" text-anchor="middle" font-size="15">signed 18 bit</text>

<rect x="980" y="275" width="260" height="150" rx="12" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="1110" y="320" text-anchor="middle" font-size="20" font-weight="bold">Accumulator</text>
<text x="1110" y="365" text-anchor="middle" font-size="16">acc + dot4</text>
<text x="1110" y="400" text-anchor="middle" font-size="15">signed 32 bit</text>
</g>

<g stroke="#111827" stroke-width="3" marker-end="url(#a)">
<line x1="250" y1="170" x2="340" y2="195"/>
<line x1="250" y1="300" x2="340" y2="245"/>
<line x1="250" y1="430" x2="340" y2="455"/>
<line x1="250" y1="560" x2="340" y2="505"/>
<line x1="530" y1="220" x2="650" y2="325"/>
<line x1="530" y1="480" x2="650" y2="375"/>
<line x1="860" y1="350" x2="980" y2="350"/>
</g>
<path d="M1110 425 L1110 535 L910 535 L910 390 L980 390" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>

<text x="680" y="625" text-anchor="middle" font-family="sans-serif" font-size="16">한 valid cycle에 4쌍을 처리하고 4-way partial dot product를 누산한다.</text>
</svg>