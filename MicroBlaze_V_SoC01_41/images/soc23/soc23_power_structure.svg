<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650">
<rect width="1320" height="650" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">FPGA Power의 큰 구조</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="70" y="115" width="330" height="260" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="235" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Static Power</text>
<text x="235" y="210" text-anchor="middle" font-family="sans-serif" font-size="17">Device Leakage</text>
<text x="235" y="250" text-anchor="middle" font-family="sans-serif" font-size="17">Temperature 영향 큼</text>
<text x="235" y="290" text-anchor="middle" font-family="sans-serif" font-size="17">Process / Voltage 영향</text>
<text x="235" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">Clock가 멈춰도 0이 되지 않음</text>

<rect x="495" y="115" width="330" height="260" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="660" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Dynamic Power</text>
<text x="660" y="210" text-anchor="middle" font-family="sans-serif" font-size="17">Clock Frequency</text>
<text x="660" y="250" text-anchor="middle" font-family="sans-serif" font-size="17">Switching Activity</text>
<text x="660" y="290" text-anchor="middle" font-family="sans-serif" font-size="17">Capacitance / Resource</text>
<text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">개념: P ∝ C · V² · f · Activity</text>

<rect x="920" y="115" width="330" height="260" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1085" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Total Power</text>
<text x="1085" y="215" text-anchor="middle" font-family="sans-serif" font-size="17">Static + Dynamic</text>
<text x="1085" y="260" text-anchor="middle" font-family="sans-serif" font-size="17">Supply별 Current</text>
<text x="1085" y="305" text-anchor="middle" font-family="sans-serif" font-size="17">Thermal 계산 입력</text>

<line x1="400" y1="245" x2="495" y2="245" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="825" y1="245" x2="920" y2="245" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<rect x="235" y="450" width="850" height="110" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="660" y="490" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold">같은 LUT 개수라도 Power는 달라질 수 있다</text>
<text x="660" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">Toggle Rate, Clock, Route, Fanout, I/O, BRAM/DSP Enable Rate가 다르면 Dynamic Power가 달라진다.</text>
</svg>