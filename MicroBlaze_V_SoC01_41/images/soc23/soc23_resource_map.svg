<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650">
<rect width="1320" height="650" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">FPGA Resource를 어떻게 읽는가</text>
<g font-family="sans-serif">
<rect x="60" y="110" width="225" height="180" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="173" y="150" text-anchor="middle" font-size="21" font-weight="bold">LUT</text>
<text x="173" y="195" text-anchor="middle" font-size="16">조합 Logic</text>
<text x="173" y="230" text-anchor="middle" font-size="16">Mux / Decode</text>
<text x="173" y="265" text-anchor="middle" font-size="16">LUTRAM 가능</text>

<rect x="315" y="110" width="225" height="180" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="428" y="150" text-anchor="middle" font-size="21" font-weight="bold">FF / Register</text>
<text x="428" y="195" text-anchor="middle" font-size="16">Pipeline</text>
<text x="428" y="230" text-anchor="middle" font-size="16">State</text>
<text x="428" y="265" text-anchor="middle" font-size="16">Data Hold</text>

<rect x="570" y="110" width="225" height="180" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="683" y="150" text-anchor="middle" font-size="21" font-weight="bold">BRAM</text>
<text x="683" y="195" text-anchor="middle" font-size="16">Buffer / FIFO</text>
<text x="683" y="230" text-anchor="middle" font-size="16">Weight / ROM</text>
<text x="683" y="265" text-anchor="middle" font-size="16">Enable Rate 중요</text>

<rect x="825" y="110" width="225" height="180" rx="14" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="938" y="150" text-anchor="middle" font-size="21" font-weight="bold">DSP</text>
<text x="938" y="195" text-anchor="middle" font-size="16">Multiply / MAC</text>
<text x="938" y="230" text-anchor="middle" font-size="16">NPU 핵심 자원</text>
<text x="938" y="265" text-anchor="middle" font-size="16">Pipeline Register</text>

<rect x="1080" y="110" width="180" height="180" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="1170" y="150" text-anchor="middle" font-size="21" font-weight="bold">Clock / I/O</text>
<text x="1170" y="195" text-anchor="middle" font-size="16">BUFG</text>
<text x="1170" y="230" text-anchor="middle" font-size="16">Clock Load</text>
<text x="1170" y="265" text-anchor="middle" font-size="16">IOSTANDARD</text>
</g>

<rect x="160" y="365" width="1000" height="155" rx="16" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="660" y="405" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Resource Report를 보는 순서</text>
<text x="660" y="445" text-anchor="middle" font-family="sans-serif" font-size="17">전체 사용률 → Hierarchy별 사용량 → Primitive 유형 → Packing / Control Set / Clock Load</text>
<text x="660" y="485" text-anchor="middle" font-family="sans-serif" font-size="16">Pipeline은 FF를 늘릴 수 있지만 LUT/Carry/Placement 결과는 실제 합성 후 확인한다.</text>
<text x="660" y="590" text-anchor="middle" font-family="sans-serif" font-size="16">Resource 사용량만으로 성능이나 전력을 단독 판정하지 않는다.</text>
</svg>