<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="610" viewBox="0 0 1260 610">
<rect width="1260" height="610" fill="white"/>
<text x="630" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Power ↔ Junction Temperature Feedback</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="90" y="205" width="240" height="150" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="210" y="250" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Dynamic Power</text>
<text x="210" y="295" text-anchor="middle" font-family="sans-serif" font-size="16">Activity / Clock / V</text>
<text x="210" y="330" text-anchor="middle" font-family="sans-serif" font-size="16">Resource Switching</text>

<rect x="420" y="205" width="240" height="150" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="540" y="250" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Total Power</text>
<text x="540" y="295" text-anchor="middle" font-family="sans-serif" font-size="16">Static + Dynamic</text>

<rect x="750" y="205" width="240" height="150" rx="14" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="870" y="250" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Junction Temp Tj</text>
<text x="870" y="295" text-anchor="middle" font-family="sans-serif" font-size="16">Ambient / Cooling</text>
<text x="870" y="330" text-anchor="middle" font-family="sans-serif" font-size="16">Board / Heat Sink</text>

<rect x="455" y="420" width="350" height="105" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="630" y="462" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold">Static / Leakage Power 증가</text>
<text x="630" y="498" text-anchor="middle" font-family="sans-serif" font-size="16">Tj 상승 → Leakage 상승</text>

<line x1="330" y1="280" x2="420" y2="280" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="660" y1="280" x2="750" y2="280" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<path d="M870 355 L870 472 L805 472" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<path d="M455 472 L380 472 L380 330 L420 330" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="630" y="575" text-anchor="middle" font-family="sans-serif" font-size="16">Thermal 조건을 실제 환경과 맞추지 않으면 Static Power와 Total Power 추정이 왜곡될 수 있다.</text>
</svg>