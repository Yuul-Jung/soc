<text x="1120" y="325" text-anchor="middle" font-family="sans-serif" font-size="16">min / avg / max</text>
<text x="1120" y="370" text-anchor="middle" font-family="sans-serif" font-size="16">UART / Timer Log</text>
<text x="1120" y="440" text-anchor="middle" font-family="sans-serif" font-size="14">실제 시스템 측정</text>
<text x="690" y="610" text-anchor="middle" font-family="sans-serif" font-size="17">세 층의 숫자를 서로 대체하지 않고 각각의 근거와 함께 기록한다.</text>
