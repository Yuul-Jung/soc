<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="680" viewBox="0 0 1380 680">
<rect width="1380" height="680" fill="white"/>
<text x="690" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">SoC 37 · Performance Baseline Layers</text>
<rect x="85" y="120" width="350" height="410" rx="16" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="260" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">① RTL Schedule</text>
<text x="260" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">Frozen RTL</text>
<text x="260" y="280" text-anchor="middle" font-family="sans-serif" font-size="16">Cycle Count</text>
<text x="260" y="325" text-anchor="middle" font-family="sans-serif" font-size="16">35 cycles</text>
<text x="260" y="370" text-anchor="middle" font-family="sans-serif" font-size="16">350 ns @ 100 MHz</text>
<text x="260" y="440" text-anchor="middle" font-family="sans-serif" font-size="14">구조상 예상값</text>

<rect x="515" y="120" width="350" height="410" rx="16" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="690" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">② Vivado Post-Route</text>
<text x="690" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">WNS / TNS</text>
<text x="690" y="280" text-anchor="middle" font-family="sans-serif" font-size="16">WHS / THS</text>
<text x="690" y="325" text-anchor="middle" font-family="sans-serif" font-size="16">LUT / FF / DSP / BRAM</text>
<text x="690" y="370" text-anchor="middle" font-family="sans-serif" font-size="16">Power / Thermal</text>
<text x="690" y="440" text-anchor="middle" font-family="sans-serif" font-size="14">도구 분석 결과</text>

<rect x="945" y="120" width="350" height="410" rx="16" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="1120" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">③ Basys3 Runtime</text>
