<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590">
<rect width="1320" height="590" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">READY / VALID Backpressure와 FIFO</text>
<g font-family="sans-serif">
<text x="80" y="130" font-size="18" font-weight="bold">FIFO valid</text>
<text x="80" y="210" font-size="18" font-weight="bold">Consumer ready</text>
<text x="80" y="290" font-size="18" font-weight="bold">Transfer</text>
<text x="80" y="370" font-size="18" font-weight="bold">FIFO count</text>
</g>

<line x1="230" y1="120" x2="1220" y2="120" stroke="#111827"/>
<line x1="230" y1="200" x2="1220" y2="200" stroke="#111827"/>
<line x1="230" y1="280" x2="1220" y2="280" stroke="#111827"/>
<line x1="230" y1="360" x2="1220" y2="360" stroke="#111827"/>

<text x="350" y="105" font-family="sans-serif" font-size="15">VALID=1</text>
<text x="515" y="185" font-family="sans-serif" font-size="15">READY=0</text>
<text x="760" y="185" font-family="sans-serif" font-size="15">READY=1</text>
<text x="520" y="265" font-family="sans-serif" font-size="15">전송 없음</text>
<text x="770" y="265" font-family="sans-serif" font-size="15">전송</text>

<rect x="420" y="390" width="260" height="90" rx="12" fill="#fff7ed" stroke="#111827"/>
<text x="550" y="425" text-anchor="middle" font-family="sans-serif" font-size="16">READY=0 동안</text>
<text x="550" y="458" text-anchor="middle" font-family="sans-serif" font-size="16">FIFO가 Prefetch Data를 보관</text>

<rect x="750" y="390" width="260" height="90" rx="12" fill="#f0fdf4" stroke="#111827"/>
<text x="880" y="425" text-anchor="middle" font-family="sans-serif" font-size="16">READY 복귀</text>
<text x="880" y="458" text-anchor="middle" font-family="sans-serif" font-size="16">저장된 Data부터 소비</text>

<text x="660" y="540" text-anchor="middle" font-family="sans-serif" font-size="16">VALID와 READY가 모두 1인 Rising Edge에서만 Stream Item이 소비된다.</text>
</svg>