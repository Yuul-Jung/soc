<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
<rect width="1280" height="600" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Prefetch Credit Control</text>

<rect x="90" y="150" width="260" height="200" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="220" y="195" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">FIFO Count</text>
<text x="220" y="245" text-anchor="middle" font-family="sans-serif" font-size="18">0 ~ 4</text>
<text x="220" y="295" text-anchor="middle" font-family="sans-serif" font-size="16">이미 도착한 Response</text>

<rect x="510" y="150" width="260" height="200" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="640" y="195" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Outstanding Reads</text>
<text x="640" y="245" text-anchor="middle" font-family="sans-serif" font-size="18">요청됨 / 아직 미도착</text>
<text x="640" y="285" text-anchor="middle" font-family="sans-serif" font-size="16"><tspan x="640" y="285">다음 Clock에 FIFO로</tspan><tspan x="640" y="313">들어올 수 있음</tspan></text>

<rect x="930" y="150" width="260" height="200" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1060" y="195" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Issue Rule</text>
<text x="1060" y="245" text-anchor="middle" font-family="sans-serif" font-size="17">FIFO + Outstanding &lt; 4</text>
<text x="1060" y="295" text-anchor="middle" font-family="sans-serif" font-size="16">공간이 있을 때만 Read</text>

<text x="640" y="430" text-anchor="middle" font-family="sans-serif" font-size="19">Consumer가 멈춰도 이미 날아간 Read Response까지 포함해 Capacity를 예약한다.</text>
<text x="640" y="480" text-anchor="middle" font-family="sans-serif" font-size="16">이 규칙이 없으면 FIFO가 Full인 상태에서 다음 BRAM Response가 도착해 Overflow할 수 있다.</text>
</svg>