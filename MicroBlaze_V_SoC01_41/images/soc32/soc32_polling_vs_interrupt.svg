<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580">
<rect width="1280" height="580" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Polling vs Interrupt</text>
<rect x="80" y="130" width="500" height="330" rx="14" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="330" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">SoC 31 · Polling</text>
<text x="330" y="240" text-anchor="middle" font-family="sans-serif" font-size="17">STATUS.DONE Read</text>
<text x="330" y="285" text-anchor="middle" font-family="sans-serif" font-size="17">↓</text>
<text x="330" y="325" text-anchor="middle" font-family="sans-serif" font-size="17">아직 0 → 다시 Read</text>
<text x="330" y="380" text-anchor="middle" font-family="sans-serif" font-size="16">CPU가 반복적으로 Bus 접근</text>
<rect x="700" y="130" width="500" height="330" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="950" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">SoC 32 · Interrupt</text>
<text x="950" y="240" text-anchor="middle" font-family="sans-serif" font-size="17">NPU 계산</text>
<text x="950" y="285" text-anchor="middle" font-family="sans-serif" font-size="17">↓ 완료 Event</text>
<text x="950" y="325" text-anchor="middle" font-family="sans-serif" font-size="17">IRQ → ISR</text>
<text x="950" y="380" text-anchor="middle" font-family="sans-serif" font-size="16">CPU는 완료 시점에만 Handler 실행</text>
<text x="640" y="525" text-anchor="middle" font-family="sans-serif" font-size="15">Interrupt가 항상 더 빠르다는 뜻이 아니라, CPU가 완료 여부만 확인하기 위해 지속적으로 Polling할 필요가 없다는 의미다.</text>
</svg>