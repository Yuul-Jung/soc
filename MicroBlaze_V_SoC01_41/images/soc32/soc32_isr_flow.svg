<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="590" viewBox="0 0 1360 590">
<rect width="1360" height="590" fill="white"/>
<text x="680" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">MicroBlaze V ISR 처리 순서</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<g font-family="sans-serif">
<rect x="55" y="175" width="220" height="150" rx="12" fill="#eef6ff" stroke="#111827"/><text x="165" y="220" text-anchor="middle" font-size="18">IRQ Entry</text><text x="165" y="265" text-anchor="middle" font-size="15">XIntc handler</text>
<rect x="330" y="175" width="220" height="150" rx="12" fill="#fff7ed" stroke="#111827"/><text x="440" y="220" text-anchor="middle" font-size="18">Read</text><text x="440" y="265" text-anchor="middle" font-size="15">IRQ_STATUS</text>
<rect x="605" y="175" width="220" height="150" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="715" y="220" text-anchor="middle" font-size="18">Software Flag</text><text x="715" y="265" text-anchor="middle" font-size="15">DONE / ERROR</text>
<rect x="880" y="175" width="220" height="150" rx="12" fill="#faf5ff" stroke="#111827"/><text x="990" y="220" text-anchor="middle" font-size="18">W1C</text><text x="990" y="265" text-anchor="middle" font-size="15">IRQ_STATUS</text>
<rect x="1155" y="175" width="150" height="150" rx="12" fill="#f8fafc" stroke="#111827"/><text x="1230" y="220" text-anchor="middle" font-size="18">Return</text><text x="1230" y="265" text-anchor="middle" font-size="15">irq low</text>
</g>
<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="275" y1="250" x2="330" y2="250"/>
<line x1="550" y1="250" x2="605" y2="250"/>
<line x1="825" y1="250" x2="880" y2="250"/>
<line x1="1100" y1="250" x2="1155" y2="250"/>
</g>
<text x="680" y="450" text-anchor="middle" font-family="sans-serif" font-size="17">Peripheral source를 먼저 clear하여 Level IRQ가 계속 유지되는 상태를 종료한다.</text>
</svg>