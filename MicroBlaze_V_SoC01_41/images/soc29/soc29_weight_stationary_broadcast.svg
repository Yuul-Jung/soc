<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="640" viewBox="0 0 1360 640">
<rect width="1360" height="640" fill="white"/>
<text x="680" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Weight Stationary + Activation Broadcast</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="70" y="170" width="270" height="250" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="205" y="215" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Activation Group</text>
<text x="205" y="270" text-anchor="middle" font-family="sans-serif" font-size="17">a0 a1 a2 a3</text>
<text x="205" y="325" text-anchor="middle" font-family="sans-serif" font-size="16">Sample 0 → 1 → 2 → 3</text>
<text x="205" y="375" text-anchor="middle" font-family="sans-serif" font-size="15">한 번 입력</text>

<rect x="510" y="105" width="300" height="220" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="660" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">PE Row CH0</text>
<text x="660" y="200" text-anchor="middle" font-family="sans-serif" font-size="16">w00 w01 w02 w03</text>
<text x="660" y="250" text-anchor="middle" font-family="sans-serif" font-size="16">Weight Register 유지</text>

<rect x="510" y="365" width="300" height="220" rx="14" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="660" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">PE Row CH1</text>
<text x="660" y="460" text-anchor="middle" font-family="sans-serif" font-size="16">w10 w11 w12 w13</text>
<text x="660" y="510" text-anchor="middle" font-family="sans-serif" font-size="16">Weight Register 유지</text>

<rect x="1000" y="185" width="270" height="330" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1135" y="230" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Partial Sums</text>
<text x="1135" y="290" text-anchor="middle" font-family="sans-serif" font-size="16">CH0 sample0..3</text>
<text x="1135" y="345" text-anchor="middle" font-family="sans-serif" font-size="16">CH1 sample0..3</text>
<text x="1135" y="410" text-anchor="middle" font-family="sans-serif" font-size="16">K tile마다 누적</text>
<text x="1135" y="465" text-anchor="middle" font-family="sans-serif" font-size="16">마지막 Tile 후 Result</text>

<path d="M340 295 L435 295 L435 215 L510 215" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<path d="M340 295 L435 295 L435 475 L510 475" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="810" y1="215" x2="1000" y2="285" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="810" y1="475" x2="1000" y2="415" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="680" y="615" text-anchor="middle" font-family="sans-serif" font-size="16">같은 Activation Group을 두 PE Row에 동시에 전달하고, 각 Row의 Weight는 Batch 4개 동안 움직이지 않는다.</text>
</svg>