<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="610" viewBox="0 0 1360 610">
<rect width="1360" height="610" fill="white"/>
<text x="680" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">K=16을 TILE_K=4로 분할</text>

<g font-family="sans-serif">
<rect x="80" y="135" width="260" height="300" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="210" y="180" text-anchor="middle" font-size="20" font-weight="bold">Tile 0</text>
<text x="210" y="230" text-anchor="middle" font-size="17">K 0..3</text>
<text x="210" y="285" text-anchor="middle" font-size="16">Weight Load 1회</text>
<text x="210" y="330" text-anchor="middle" font-size="16">Sample 0..3 처리</text>
<text x="210" y="385" text-anchor="middle" font-size="16">psum 유지</text>

<rect x="390" y="135" width="260" height="300" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="520" y="180" text-anchor="middle" font-size="20" font-weight="bold">Tile 1</text>
<text x="520" y="230" text-anchor="middle" font-size="17">K 4..7</text>
<text x="520" y="285" text-anchor="middle" font-size="16">Weight Load 1회</text>
<text x="520" y="330" text-anchor="middle" font-size="16">Sample 0..3 처리</text>
<text x="520" y="385" text-anchor="middle" font-size="16">psum 누적</text>

<rect x="700" y="135" width="260" height="300" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="830" y="180" text-anchor="middle" font-size="20" font-weight="bold">Tile 2</text>
<text x="830" y="230" text-anchor="middle" font-size="17">K 8..11</text>
<text x="830" y="285" text-anchor="middle" font-size="16">Weight Load 1회</text>
<text x="830" y="330" text-anchor="middle" font-size="16">Sample 0..3 처리</text>
<text x="830" y="385" text-anchor="middle" font-size="16">psum 누적</text>

<rect x="1010" y="135" width="260" height="300" rx="14" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="1140" y="180" text-anchor="middle" font-size="20" font-weight="bold">Tile 3</text>
<text x="1140" y="230" text-anchor="middle" font-size="17">K 12..15</text>
<text x="1140" y="285" text-anchor="middle" font-size="16">Weight Load 1회</text>
<text x="1140" y="330" text-anchor="middle" font-size="16">Sample 0..3 처리</text>
<text x="1140" y="385" text-anchor="middle" font-size="16">Final Result</text>
</g>

<text x="680" y="510" text-anchor="middle" font-family="sans-serif" font-size="18">4 Tiles × 4 Samples × 2 Output Channels × 4 MAC/Lane = 128 MAC</text>
<text x="680" y="555" text-anchor="middle" font-family="sans-serif" font-size="16">Tile 경계에서만 Weight를 바꾸고, Tile 내부 Batch 처리 동안 Weight Register는 고정한다.</text>
</svg>