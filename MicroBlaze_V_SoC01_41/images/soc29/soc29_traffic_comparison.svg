<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610">
<rect width="1280" height="610" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Input Scalar Traffic 비교 · B=4, M=2, K=16</text>

<rect x="90" y="130" width="460" height="340" rx="14" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="320" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Reuse 없음</text>
<text x="320" y="235" text-anchor="middle" font-family="sans-serif" font-size="17">Weight = B×M×K = 128</text>
<text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-size="17">Activation = B×M×K = 128</text>
<text x="320" y="345" text-anchor="middle" font-family="sans-serif" font-size="19">Total = 256 scalar reads</text>
<text x="320" y="410" text-anchor="middle" font-family="sans-serif" font-size="15">Output / psum traffic 제외</text>

<rect x="730" y="130" width="460" height="340" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="960" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">WS + Activation Broadcast</text>
<text x="960" y="235" text-anchor="middle" font-family="sans-serif" font-size="17">Weight = M×K = 32</text>
<text x="960" y="285" text-anchor="middle" font-family="sans-serif" font-size="17">Activation = B×K = 64</text>
<text x="960" y="345" text-anchor="middle" font-family="sans-serif" font-size="19">Total = 96 scalar reads</text>
<text x="960" y="410" text-anchor="middle" font-family="sans-serif" font-size="15">Weight 4× / Activation 2× reuse</text>

<text x="640" y="535" text-anchor="middle" font-family="sans-serif" font-size="18">256 / 96 → 입력 Scalar Traffic 약 2.667배 감소</text>
<text x="640" y="575" text-anchor="middle" font-family="sans-serif" font-size="14">교육용 비교 모델이며 Cache/BRAM/NoC/psum/output traffic은 포함하지 않는다.</text>
</svg>