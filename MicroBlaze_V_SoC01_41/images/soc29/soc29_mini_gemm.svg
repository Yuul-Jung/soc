<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="650" viewBox="0 0 1380 650">
<rect width="1380" height="650" fill="white"/>
<text x="690" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">SoC 29 · Mini GEMM Micro-kernel</text>

<rect x="65" y="130" width="340" height="360" rx="16" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="235" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Activation X</text>
<text x="235" y="220" text-anchor="middle" font-family="sans-serif" font-size="17">B = 4 samples</text>
<text x="235" y="260" text-anchor="middle" font-family="sans-serif" font-size="17">K = 16</text>
<text x="235" y="315" text-anchor="middle" font-family="monospace" font-size="15">X[4][16]</text>
<text x="235" y="370" text-anchor="middle" font-family="sans-serif" font-size="16">K tile = 4</text>
<text x="235" y="420" text-anchor="middle" font-family="sans-serif" font-size="16">4 activation groups / tile</text>

<rect x="520" y="130" width="340" height="360" rx="16" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="690" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Stationary Weight W</text>
<text x="690" y="220" text-anchor="middle" font-family="sans-serif" font-size="17">M = 2 output channels</text>
<text x="690" y="260" text-anchor="middle" font-family="sans-serif" font-size="17">K = 16</text>
<text x="690" y="315" text-anchor="middle" font-family="monospace" font-size="15">W[2][16]</text>
<text x="690" y="370" text-anchor="middle" font-family="sans-serif" font-size="16">각 K tile weight를 1회 Load</text>
<text x="690" y="420" text-anchor="middle" font-family="sans-serif" font-size="16">Batch 4개 동안 유지</text>

<rect x="975" y="130" width="340" height="360" rx="16" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1145" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Output Y</text>
<text x="1145" y="220" text-anchor="middle" font-family="sans-serif" font-size="17">B = 4</text>
<text x="1145" y="260" text-anchor="middle" font-family="sans-serif" font-size="17">M = 2</text>
<text x="1145" y="315" text-anchor="middle" font-family="monospace" font-size="15">Y[4][2]</text>
<text x="1145" y="370" text-anchor="middle" font-family="sans-serif" font-size="16">총 MAC = 4 × 2 × 16</text>
<text x="1145" y="420" text-anchor="middle" font-family="sans-serif" font-size="16">→ 128 MAC</text>

<text x="690" y="565" text-anchor="middle" font-family="sans-serif" font-size="18">Y = X × Wᵀ</text>
<text x="690" y="605" text-anchor="middle" font-family="sans-serif" font-size="15">교육용 작은 GEMM으로 Weight Stationary · Activation Broadcast · K Tiling을 동시에 관찰한다.</text>
</svg>