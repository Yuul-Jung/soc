<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570">
<rect width="1280" height="570" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Legacy Interface ↔ Register Contract 변환</text>
<g font-family="sans-serif" font-size="17">
<rect x="80" y="105" width="470" height="355" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="315" y="150" text-anchor="middle" font-size="21" font-weight="bold">기존 RTL Interface</text>
<text x="140" y="205">launch_i</text><text x="355" y="205">← START</text>
<text x="140" y="250">opcode_i[1:0]</text><text x="355" y="250">← MODE</text>
<text x="140" y="295">operand_i[31:0]</text><text x="355" y="295">← DATA_IN</text>
<text x="140" y="340">active_o</text><text x="355" y="340">→ BUSY</text>
<text x="140" y="385">done_pulse_o</text><text x="355" y="385">→ DONE Event</text>
<text x="140" y="430">result_o[31:0]</text><text x="355" y="430">→ DATA_OUT</text>

<rect x="730" y="105" width="470" height="355" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="965" y="150" text-anchor="middle" font-size="21" font-weight="bold">Register / Driver Contract</text>
<text x="790" y="205">CONTROL.MODE</text><text x="1005" y="205">2 bit</text>
<text x="790" y="250">COMMAND.START</text><text x="1005" y="250">W1P</text>
<text x="790" y="295">DATA_IN</text><text x="1005" y="295">RW</text>
<text x="790" y="340">STATUS.BUSY</text><text x="1005" y="340">RO</text>
<text x="790" y="385">STATUS.DONE</text><text x="1005" y="385">retained</text>
<text x="790" y="430">DATA_OUT</text><text x="1005" y="430">RO</text>
</g>
<text x="640" y="515" text-anchor="middle" font-family="sans-serif" font-size="17">Adapter가 Pulse/Level/Retained 상태의 의미 차이를 흡수한다.</text>
</svg>