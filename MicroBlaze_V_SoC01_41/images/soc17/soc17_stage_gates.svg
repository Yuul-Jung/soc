<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="560" viewBox="0 0 1260 560">
<rect width="1260" height="560" fill="white"/>
<text x="630" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">기존 RTL IP화 Stage Gate</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<g font-family="sans-serif">
<rect x="50" y="165" width="195" height="125" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="148" y="205" text-anchor="middle" font-size="19" font-weight="bold">Gate 1</text>
<text x="148" y="240" text-anchor="middle" font-size="16">기존 RTL 단독</text><text x="148" y="267" text-anchor="middle" font-size="16">동작 검증</text>

<rect x="295" y="165" width="195" height="125" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="393" y="205" text-anchor="middle" font-size="19" font-weight="bold">Gate 2</text>
<text x="393" y="240" text-anchor="middle" font-size="16">Adapter</text><text x="393" y="267" text-anchor="middle" font-size="16">Contract 검증</text>

<rect x="540" y="165" width="195" height="125" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="638" y="205" text-anchor="middle" font-size="19" font-weight="bold">Gate 3</text>
<text x="638" y="240" text-anchor="middle" font-size="16">AXI Register</text><text x="638" y="267" text-anchor="middle" font-size="16">통합 검증</text>

<rect x="785" y="165" width="195" height="125" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="883" y="205" text-anchor="middle" font-size="19" font-weight="bold">Gate 4</text>
<text x="883" y="240" text-anchor="middle" font-size="16">Software Driver</text><text x="883" y="267" text-anchor="middle" font-size="16">Regression</text>

<rect x="1030" y="165" width="180" height="125" rx="12" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="1120" y="205" text-anchor="middle" font-size="19" font-weight="bold">Gate 5</text>
<text x="1120" y="240" text-anchor="middle" font-size="16">Vivado</text><text x="1120" y="267" text-anchor="middle" font-size="16">Packaging</text>
</g>
<g stroke="#111827" stroke-width="3" marker-end="url(#a)">
<line x1="245" y1="228" x2="295" y2="228"/>
<line x1="490" y1="228" x2="540" y2="228"/>
<line x1="735" y1="228" x2="785" y2="228"/>
<line x1="980" y1="228" x2="1030" y2="228"/>
</g>
<text x="630" y="395" text-anchor="middle" font-family="sans-serif" font-size="18">앞 Gate가 실패한 상태에서 다음 Gate로 넘어가지 않는다.</text>
<text x="630" y="435" text-anchor="middle" font-family="sans-serif" font-size="16">특히 기존 RTL 자체의 버그와 AXI Wrapper의 버그를 섞지 않는 것이 중요하다.</text>
</svg>