<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640">
<rect width="1320" height="640" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">기존 Verilog RTL → AXI4-Lite IP</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="55" y="175" width="245" height="250" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="178" y="220" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Existing RTL</text>
<text x="178" y="260" text-anchor="middle" font-family="sans-serif" font-size="17">legacy_processing_core</text>
<text x="178" y="310" text-anchor="middle" font-family="sans-serif" font-size="16">launch / opcode / operand</text>
<text x="178" y="345" text-anchor="middle" font-family="sans-serif" font-size="16">active / done_pulse / result</text>
<text x="178" y="392" text-anchor="middle" font-family="sans-serif" font-size="16">원본 수정 없음</text>

<rect x="380" y="145" width="260" height="310" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="510" y="190" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Legacy Adapter</text>
<text x="510" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">enable / mode / start</text>
<text x="510" y="270" text-anchor="middle" font-family="sans-serif" font-size="16">↓</text>
<text x="510" y="305" text-anchor="middle" font-family="sans-serif" font-size="16">launch / opcode</text>
<text x="510" y="350" text-anchor="middle" font-family="sans-serif" font-size="16">done pulse → retained DONE</text>
<text x="510" y="385" text-anchor="middle" font-family="sans-serif" font-size="16">invalid start → ERROR</text>

<rect x="720" y="145" width="260" height="310" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="850" y="190" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Register Bank</text>
<text x="850" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">CONTROL / COMMAND</text>
<text x="850" y="270" text-anchor="middle" font-family="sans-serif" font-size="16">DATA_IN</text>
<text x="850" y="325" text-anchor="middle" font-family="sans-serif" font-size="16">STATUS / DATA_OUT</text>
<text x="850" y="360" text-anchor="middle" font-family="sans-serif" font-size="16">IRQ_STATUS</text>
<text x="850" y="405" text-anchor="middle" font-family="sans-serif" font-size="16">Register Map 재사용</text>

<rect x="1060" y="175" width="205" height="250" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="1163" y="220" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">AXI Adapter</text>
<text x="1163" y="265" text-anchor="middle" font-family="sans-serif" font-size="17">AW / W / B</text>
<text x="1163" y="300" text-anchor="middle" font-family="sans-serif" font-size="17">AR / R</text>
<text x="1163" y="350" text-anchor="middle" font-family="sans-serif" font-size="16">S_AXI</text>
<text x="1163" y="390" text-anchor="middle" font-family="sans-serif" font-size="16">AXI 재사용</text>

<line x1="300" y1="300" x2="380" y2="300" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="640" y1="300" x2="720" y2="300" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="980" y1="300" x2="1060" y2="300" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="660" y="565" text-anchor="middle" font-family="sans-serif" font-size="17">변환의 핵심은 “기존 RTL 수정”이 아니라 “인터페이스 의미를 Adapter로 번역”하는 것이다.</text>
</svg>