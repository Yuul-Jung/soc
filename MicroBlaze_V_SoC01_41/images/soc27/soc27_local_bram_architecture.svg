<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="650" viewBox="0 0 1360 650">
<rect width="1360" height="650" fill="white"/>
<text x="680" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">SoC 27 · Local BRAM Data Feeding</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="55" y="130" width="250" height="180" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="180" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Activation BRAM</text>
<text x="180" y="220" text-anchor="middle" font-family="sans-serif" font-size="16">256 × 32 bit</text>
<text x="180" y="260" text-anchor="middle" font-family="sans-serif" font-size="16">4 × int8 / word</text>

<rect x="55" y="370" width="250" height="180" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="180" y="415" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Weight BRAM</text>
<text x="180" y="460" text-anchor="middle" font-family="sans-serif" font-size="16">256 × 32 bit</text>
<text x="180" y="500" text-anchor="middle" font-family="sans-serif" font-size="16">4 × int8 / word</text>

<rect x="430" y="220" width="270" height="220" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="565" y="265" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Address Generator</text>
<text x="565" y="310" text-anchor="middle" font-family="sans-serif" font-size="16">group 0,1,2,...</text>
<text x="565" y="350" text-anchor="middle" font-family="sans-serif" font-size="16">Synchronous Read</text>
<text x="565" y="390" text-anchor="middle" font-family="sans-serif" font-size="16">rd_valid</text>

<rect x="825" y="220" width="270" height="220" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="960" y="265" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">SoC 26 Controller</text>
<text x="960" y="310" text-anchor="middle" font-family="sans-serif" font-size="16">Tail Mask</text>
<text x="960" y="350" text-anchor="middle" font-family="sans-serif" font-size="16">PE4 Pipeline</text>
<text x="960" y="390" text-anchor="middle" font-family="sans-serif" font-size="16">Drain / Finalize</text>

<rect x="1180" y="250" width="140" height="160" rx="14" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="1250" y="295" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold">Result</text>
<text x="1250" y="340" text-anchor="middle" font-family="sans-serif" font-size="15">32-bit ACC</text>
<text x="1250" y="380" text-anchor="middle" font-family="sans-serif" font-size="15">done</text>

<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="305" y1="220" x2="430" y2="285"/>
<line x1="305" y1="460" x2="430" y2="375"/>
<line x1="700" y1="330" x2="825" y2="330"/>
<line x1="1095" y1="330" x2="1180" y2="330"/>
