<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="560" viewBox="0 0 1450 560">
<rect width="1450" height="560" fill="white"/>
<text x="725" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">One Job · Software to Hardware to Software</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<g font-family="sans-serif">
<rect x="25" y="180" width="155" height="120" rx="12" fill="#eef6ff" stroke="#111827"/><text x="102" y="225" text-anchor="middle" font-size="16">Tensor Fill</text><text x="102" y="265" text-anchor="middle" font-size="13">CPU</text>
<rect x="205" y="180" width="155" height="120" rx="12" fill="#fff7ed" stroke="#111827"/><text x="282" y="225" text-anchor="middle" font-size="16">Descriptor</text><text x="282" y="265" text-anchor="middle" font-size="13">Shadow</text>
<rect x="385" y="180" width="155" height="120" rx="12" fill="#fff7ed" stroke="#111827"/><text x="462" y="225" text-anchor="middle" font-size="16">START</text><text x="462" y="265" text-anchor="middle" font-size="13">Snapshot</text>
<rect x="565" y="180" width="155" height="120" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="642" y="225" text-anchor="middle" font-size="16">Read</text><text x="642" y="265" text-anchor="middle" font-size="13">BRAM Port B</text>
<rect x="745" y="180" width="155" height="120" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="822" y="225" text-anchor="middle" font-size="16">Compute</text><text x="822" y="265" text-anchor="middle" font-size="13">Requantize</text>
<rect x="925" y="180" width="155" height="120" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="1002" y="225" text-anchor="middle" font-size="16">Write</text><text x="1002" y="265" text-anchor="middle" font-size="13">Output BRAM</text>
<rect x="1105" y="180" width="155" height="120" rx="12" fill="#faf5ff" stroke="#111827"/><text x="1182" y="225" text-anchor="middle" font-size="16">IRQ / ISR</text><text x="1182" y="265" text-anchor="middle" font-size="13">W1C</text>
<rect x="1285" y="180" width="140" height="120" rx="12" fill="#fef2f2" stroke="#111827"/><text x="1355" y="225" text-anchor="middle" font-size="16">Verify</text><text x="1355" y="265" text-anchor="middle" font-size="13">PASS/FAIL</text>
</g>
<g stroke="#111827" stroke-width="3.5" marker-end="url(#a)">
<line x1="180" y1="240" x2="205" y2="240"/><line x1="360" y1="240" x2="385" y2="240"/><line x1="540" y1="240" x2="565" y2="240"/><line x1="720" y1="240" x2="745" y2="240"/><line x1="900" y1="240" x2="925" y2="240"/><line x1="1080" y1="240" x2="1105" y2="240"/><line x1="1260" y1="240" x2="1285" y2="240"/>
</g>
<text x="725" y="410" text-anchor="middle" font-family="sans-serif" font-size="17">완료 확인은 STATUS.DONE 반복 Read가 아니라 ISR이 기록한 Software Flag를 사용한다.</text>
</svg>