<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640">
<rect width="1320" height="640" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Sequential Job Regression</text>

<rect x="95" y="120" width="500" height="390" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="345" y="170" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">JOB 0</text>
<text x="345" y="225" text-anchor="middle" font-family="sans-serif" font-size="17">INPUT_BASE 0x200</text>
<text x="345" y="265" text-anchor="middle" font-family="sans-serif" font-size="17">OUTPUT_BASE 0x300</text>
<text x="345" y="315" text-anchor="middle" font-family="sans-serif" font-size="16">OUT0 0x20181008</text>
<text x="345" y="355" text-anchor="middle" font-family="sans-serif" font-size="16">OUT1 0x7F7F6333</text>
<text x="345" y="405" text-anchor="middle" font-family="sans-serif" font-size="17">JOB_ID 1</text>
<text x="345" y="455" text-anchor="middle" font-family="sans-serif" font-size="16">DONE IRQ → W1C</text>

<rect x="725" y="120" width="500" height="390" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="975" y="170" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">JOB 1</text>
<text x="975" y="225" text-anchor="middle" font-family="sans-serif" font-size="17">INPUT_BASE 0x400</text>
<text x="975" y="265" text-anchor="middle" font-family="sans-serif" font-size="17">OUTPUT_BASE 0x500</text>
<text x="975" y="315" text-anchor="middle" font-family="sans-serif" font-size="16">OUT0 0x04030201</text>
<text x="975" y="355" text-anchor="middle" font-family="sans-serif" font-size="16">OUT1 0x1B150F09</text>
<text x="975" y="405" text-anchor="middle" font-family="sans-serif" font-size="17">JOB_ID 2</text>
<text x="975" y="455" text-anchor="middle" font-family="sans-serif" font-size="16">DONE IRQ → W1C</text>

<text x="660" y="575" text-anchor="middle" font-family="sans-serif" font-size="17">같은 Bitstream / 같은 RTL에서 Tensor와 Descriptor만 바꿔 연속 실행한다.</text>
</svg>