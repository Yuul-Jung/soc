<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
<rect width="1440" height="720" fill="white"/>
<text x="720" y="44" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold">SoC 36 · CPU ↔ NPU End-to-End Inference Flow</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

