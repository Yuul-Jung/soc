<text x="510" y="230" text-anchor="middle" font-family="sans-serif" font-size="15">Descriptor / Status / IRQ</text>

<rect x="360" y="405" width="300" height="190" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
