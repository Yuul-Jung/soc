<text x="510" y="540" text-anchor="middle" font-family="sans-serif" font-size="15">Tensor BRAM Port A</text>

<rect x="765" y="205" width="350" height="300" rx="14" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="940" y="255" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">NPU Accelerator</text>
