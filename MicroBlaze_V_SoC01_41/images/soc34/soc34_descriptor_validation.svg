<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650">
<rect width="1320" height="650" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Descriptor Validation Gate</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="70" y="120" width="240" height="150" rx="12" fill="#eef6ff" stroke="#111827"/><text x="190" y="170" text-anchor="middle" font-family="sans-serif" font-size="20">START</text><text x="190" y="215" text-anchor="middle" font-family="sans-serif" font-size="15">Shadow Descriptor</text>
<rect x="400" y="90" width="390" height="320" rx="12" fill="#fff7ed" stroke="#111827"/><text x="595" y="140" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Validation</text><text x="595" y="195" text-anchor="middle" font-family="sans-serif" font-size="15">4-byte alignment</text><text x="595" y="235" text-anchor="middle" font-family="sans-serif" font-size="15">length = 8</text><text x="595" y="275" text-anchor="middle" font-family="sans-serif" font-size="15">4 KB range</text><text x="595" y="315" text-anchor="middle" font-family="sans-serif" font-size="15">no overlap</text><text x="595" y="355" text-anchor="middle" font-family="sans-serif" font-size="15">engine idle</text>
<rect x="900" y="100" width="300" height="140" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="1050" y="150" text-anchor="middle" font-family="sans-serif" font-size="20">VALID</text><text x="1050" y="195" text-anchor="middle" font-family="sans-serif" font-size="15">Snapshot + JOB_ID++</text>
<rect x="900" y="315" width="300" height="140" rx="12" fill="#fef2f2" stroke="#111827"/><text x="1050" y="365" text-anchor="middle" font-family="sans-serif" font-size="20">INVALID</text><text x="1050" y="410" text-anchor="middle" font-family="sans-serif" font-size="15">Reject + ERROR_CODE</text>
<line x1="310" y1="195" x2="400" y2="195" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><line x1="790" y1="170" x2="900" y2="170" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><line x1="790" y1="345" x2="900" y2="385" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="660" y="540" text-anchor="middle" font-family="sans-serif" font-size="16">잘못된 Job은 NPU를 시작하지 않고 JOB_ID도 증가시키지 않는다.</text>
</svg>