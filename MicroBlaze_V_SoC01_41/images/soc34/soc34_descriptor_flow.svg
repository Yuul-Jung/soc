<g stroke="#111827" stroke-width="4" marker-end="url(#a)"><line x1="320" y1="270" x2="390" y2="270"/><line x1="670" y1="270" x2="760" y2="270"/><line x1="1040" y1="270" x2="1110" y2="270"/></g>
<text x="690" y="505" text-anchor="middle" font-family="sans-serif" font-size="17">START는 단순 Pulse가 아니라 “이 Descriptor를 하나의 Job으로 수락한다”는 의미가 된다.</text>
