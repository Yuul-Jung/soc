<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="620" viewBox="0 0 1380 620">
<rect width="1380" height="620" fill="white"/>
<text x="690" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">SoC 34 · Job Descriptor Flow</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="70" y="165" width="250" height="210" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="195" y="215" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Software</text>
<text x="195" y="265" text-anchor="middle" font-family="sans-serif" font-size="15">INPUT_BASE</text><text x="195" y="300" text-anchor="middle" font-family="sans-serif" font-size="15">OUTPUT_BASE</text><text x="195" y="335" text-anchor="middle" font-family="sans-serif" font-size="15">LENGTH / PARAMS</text>
<rect x="390" y="135" width="280" height="270" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="530" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Shadow Descriptor</text>
<text x="530" y="240" text-anchor="middle" font-family="sans-serif" font-size="15">Software writable</text><text x="530" y="285" text-anchor="middle" font-family="sans-serif" font-size="15">Validate on START</text><text x="530" y="330" text-anchor="middle" font-family="sans-serif" font-size="15">next job 준비 가능</text>
<rect x="760" y="135" width="280" height="270" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="900" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Active Snapshot</text>
<text x="900" y="240" text-anchor="middle" font-family="sans-serif" font-size="15">START 수락 순간 복사</text><text x="900" y="285" text-anchor="middle" font-family="sans-serif" font-size="15">Job 실행 동안 고정</text><text x="900" y="330" text-anchor="middle" font-family="sans-serif" font-size="15">NPU Engine 입력</text>
<rect x="1110" y="165" width="210" height="210" rx="14" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
