<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="570" viewBox="0 0 1260 570">
<rect width="1260" height="570" fill="white"/>
<text x="630" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Ports and Interfaces</text>
<rect x="70" y="110" width="510" height="370" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="325" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">S_AXI · AXI4-Lite Slave</text>
<g font-family="monospace" font-size="16">
<text x="120" y="205">AW : awaddr awprot awvalid awready</text>
<text x="120" y="245">W  : wdata wstrb wvalid wready</text>
<text x="120" y="285">B  : bresp bvalid bready</text>
<text x="120" y="325">AR : araddr arprot arvalid arready</text>
<text x="120" y="365">R  : rdata rresp rvalid rready</text>
</g>
<text x="325" y="430" text-anchor="middle" font-family="sans-serif" font-size="16">Port prefix: s_axi_*</text>

<rect x="680" y="110" width="510" height="160" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="935" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Clock Interface</text>
<text x="935" y="202" text-anchor="middle" font-family="monospace" font-size="17">s_axi_aclk</text>
<text x="935" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">ASSOCIATED_BUSIF = S_AXI</text>

<rect x="680" y="320" width="510" height="160" rx="14" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="935" y="365" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Reset Interface</text>
<text x="935" y="412" text-anchor="middle" font-family="monospace" font-size="17">s_axi_aresetn</text>
<text x="935" y="445" text-anchor="middle" font-family="sans-serif" font-size="16">POLARITY = ACTIVE_LOW</text>
</svg>