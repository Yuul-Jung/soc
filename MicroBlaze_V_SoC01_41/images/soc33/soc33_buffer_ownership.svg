<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="580" viewBox="0 0 1320 580">
<rect width="1320" height="580" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Tensor Buffer Ownership</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="80" y="180" width="250" height="150" rx="12" fill="#eef6ff" stroke="#111827"/><text x="205" y="225" text-anchor="middle" font-family="sans-serif" font-size="19">CPU_FILL</text><text x="205" y="270" text-anchor="middle" font-family="sans-serif" font-size="15">Input Tensor Write</text>
<rect x="405" y="180" width="250" height="150" rx="12" fill="#fff7ed" stroke="#111827"/><text x="530" y="225" text-anchor="middle" font-family="sans-serif" font-size="19">NPU_BUSY</text><text x="530" y="270" text-anchor="middle" font-family="sans-serif" font-size="15">CPU buffer access 금지</text>
<rect x="730" y="180" width="250" height="150" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="855" y="225" text-anchor="middle" font-family="sans-serif" font-size="19">NPU_DONE</text><text x="855" y="270" text-anchor="middle" font-family="sans-serif" font-size="15">ownership 반환</text>
<rect x="1055" y="180" width="190" height="150" rx="12" fill="#faf5ff" stroke="#111827"/><text x="1150" y="225" text-anchor="middle" font-family="sans-serif" font-size="19">CPU_READ</text><text x="1150" y="270" text-anchor="middle" font-family="sans-serif" font-size="15">Output Read</text>
<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="330" y1="255" x2="405" y2="255"/>
<line x1="655" y1="255" x2="730" y2="255"/>
<line x1="980" y1="255" x2="1055" y2="255"/>
</g>
<text x="660" y="435" text-anchor="middle" font-family="sans-serif" font-size="16">True Dual-Port라는 이유만으로 같은 Tensor Address를 CPU와 NPU가 동시에 수정하지 않는다.</text>
</svg>