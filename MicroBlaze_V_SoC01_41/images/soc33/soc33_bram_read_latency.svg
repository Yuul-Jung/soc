<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520">
<rect width="1250" height="520" fill="white"/>
<text x="625" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Synchronous BRAM Read</text>
<rect x="100" y="160" width="300" height="150" rx="12" fill="#eef6ff" stroke="#111827"/><text x="250" y="210" text-anchor="middle" font-family="sans-serif" font-size="20">READ_REQ</text><text x="250" y="255" text-anchor="middle" font-family="sans-serif" font-size="16">EN=1 / Address</text>
<rect x="475" y="160" width="300" height="150" rx="12" fill="#fff7ed" stroke="#111827"/><text x="625" y="210" text-anchor="middle" font-family="sans-serif" font-size="20">Clock Edge</text><text x="625" y="255" text-anchor="middle" font-family="sans-serif" font-size="16">BRAM output register</text>
<rect x="850" y="160" width="300" height="150" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="1000" y="210" text-anchor="middle" font-family="sans-serif" font-size="20">READ_CAPTURE</text><text x="1000" y="255" text-anchor="middle" font-family="sans-serif" font-size="16">bram_rdata capture</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
