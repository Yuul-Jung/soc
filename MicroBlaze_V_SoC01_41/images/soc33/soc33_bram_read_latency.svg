<line x1="775" y1="235" x2="850" y2="235" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="625" y="400" text-anchor="middle" font-family="sans-serif" font-size="16">주소를 내보낸 Clock과 데이터를 사용하는 Clock을 분리해서 생각한다.</text>
