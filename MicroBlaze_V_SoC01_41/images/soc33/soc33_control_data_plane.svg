<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="660" viewBox="0 0 1420 660">
<rect width="1420" height="660" fill="white"/>
<text x="710" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">SoC 33 · Control Plane / Data Plane 분리</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<text x="710" y="105" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Control Plane</text>
<rect x="80" y="135" width="230" height="120" rx="12" fill="#eef6ff" stroke="#111827"/><text x="195" y="185" text-anchor="middle" font-family="sans-serif" font-size="19">MicroBlaze V</text><text x="195" y="220" text-anchor="middle" font-family="sans-serif" font-size="14">command / status</text>
<rect x="450" y="135" width="260" height="120" rx="12" fill="#fff7ed" stroke="#111827"/><text x="580" y="185" text-anchor="middle" font-family="sans-serif" font-size="19">AXI4-Lite</text><text x="580" y="220" text-anchor="middle" font-family="sans-serif" font-size="14">register / irq</text>
<rect x="850" y="135" width="300" height="120" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="1000" y="185" text-anchor="middle" font-family="sans-serif" font-size="19">NPU Control</text><text x="1000" y="220" text-anchor="middle" font-family="sans-serif" font-size="14">START / BUSY / IRQ</text>
<line x1="310" y1="195" x2="450" y2="195" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><line x1="710" y1="195" x2="850" y2="195" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="710" y="340" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Data Plane</text>
<rect x="80" y="375" width="230" height="140" rx="12" fill="#eef6ff" stroke="#111827"/><text x="195" y="425" text-anchor="middle" font-family="sans-serif" font-size="19">MicroBlaze V</text><text x="195" y="465" text-anchor="middle" font-family="sans-serif" font-size="14">tensor read / write</text>
<rect x="390" y="375" width="270" height="140" rx="12" fill="#fff7ed" stroke="#111827"/><text x="525" y="425" text-anchor="middle" font-family="sans-serif" font-size="19">AXI BRAM Controller</text><text x="525" y="465" text-anchor="middle" font-family="sans-serif" font-size="14">Port A</text>
<rect x="760" y="345" width="280" height="200" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="900" y="400" text-anchor="middle" font-family="sans-serif" font-size="19">True Dual-Port BRAM</text><text x="900" y="445" text-anchor="middle" font-family="sans-serif" font-size="14">Port A ← CPU</text><text x="900" y="480" text-anchor="middle" font-family="sans-serif" font-size="14">Port B → NPU</text>
<rect x="1130" y="375" width="220" height="140" rx="12" fill="#faf5ff" stroke="#111827"/><text x="1240" y="425" text-anchor="middle" font-family="sans-serif" font-size="19">NPU Engine</text><text x="1240" y="465" text-anchor="middle" font-family="sans-serif" font-size="14">native BRAM port</text>
<line x1="310" y1="445" x2="390" y2="445" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><line x1="660" y1="445" x2="760" y2="445" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><line x1="1040" y1="445" x2="1130" y2="445" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="710" y="610" text-anchor="middle" font-family="sans-serif" font-size="16">제어 정보와 Tensor Data를 서로 다른 경로로 분리한다.</text>
</svg>