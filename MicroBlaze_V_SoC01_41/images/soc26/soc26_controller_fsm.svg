<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="610" viewBox="0 0 1320 610">
<rect width="1320" height="610" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Vector Dot Product Controller FSM</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<g font-family="sans-serif">
<rect x="55" y="190" width="180" height="120" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="145" y="235" text-anchor="middle" font-size="21" font-weight="bold">IDLE</text>
<text x="145" y="275" text-anchor="middle" font-size="15">start 대기</text>

<rect x="285" y="190" width="180" height="120" rx="14" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="375" y="235" text-anchor="middle" font-size="21" font-weight="bold">CLEAR</text>
<text x="375" y="275" text-anchor="middle" font-size="15">PE Pipeline/ACC 초기화</text>

<rect x="515" y="190" width="180" height="120" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="605" y="235" text-anchor="middle" font-size="21" font-weight="bold">FEED</text>
<text x="605" y="275" text-anchor="middle" font-size="15">vec_valid/ready</text>

<rect x="745" y="190" width="180" height="120" rx="14" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="835" y="235" text-anchor="middle" font-size="21" font-weight="bold">DRAIN</text>
<text x="835" y="275" text-anchor="middle" font-size="15">PE 완료 Group 대기</text>

<rect x="975" y="190" width="220" height="120" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1085" y="235" text-anchor="middle" font-size="21" font-weight="bold">FINALIZE</text>
<text x="1085" y="275" text-anchor="middle" font-size="15">result + done pulse</text>
</g>

<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="235" y1="250" x2="285" y2="250"/>
<line x1="465" y1="250" x2="515" y2="250"/>
<line x1="695" y1="250" x2="745" y2="250"/>
<line x1="925" y1="250" x2="975" y2="250"/>
<path d="M1085 310 L1085 430 L145 430 L145 310" fill="none"/>
</g>

<text x="260" y="160" font-family="sans-serif" font-size="14">start, length &gt; 0</text>
<text x="695" y="160" font-family="sans-serif" font-size="14">마지막 input group 수락</text>
<text x="920" y="160" font-family="sans-serif" font-size="14">마지막 pe_valid 완료</text>
<text x="660" y="505" text-anchor="middle" font-family="sans-serif" font-size="17">length = 0은 IDLE에서 result=0 / done/result_valid pulse로 바로 처리</text>
<text x="660" y="550" text-anchor="middle" font-family="sans-serif" font-size="16">Pipeline Latency 숫자를 Controller에 하드코딩하지 않고 pe_valid_o를 Completion 기준으로 사용한다.</text>
</svg>