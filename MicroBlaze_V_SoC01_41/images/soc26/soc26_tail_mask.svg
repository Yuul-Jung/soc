<rect x="900" y="170" width="300" height="300" rx="14" fill="#fafafa" stroke="#111827" stroke-width="2"/>
<text x="1050" y="215" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">계산</text>
<text x="1050" y="265" text-anchor="middle" font-family="sans-serif" font-size="17">groups = ceil(10/4)</text>
<text x="1050" y="305" text-anchor="middle" font-family="sans-serif" font-size="17">→ 3 groups</text>
<text x="1050" y="360" text-anchor="middle" font-family="sans-serif" font-size="17">tail = 10 mod 4</text>
<text x="1050" y="400" text-anchor="middle" font-family="sans-serif" font-size="17">→ 2 valid lanes</text>
