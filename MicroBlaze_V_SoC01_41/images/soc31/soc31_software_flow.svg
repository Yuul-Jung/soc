<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650">
<rect width="1320" height="650" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">MicroBlaze V Software Control Flow</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<g font-family="sans-serif">
<rect x="80" y="115" width="230" height="105" rx="12" fill="#eef6ff" stroke="#111827"/><text x="195" y="158" text-anchor="middle" font-size="18">VERSION Read</text><text x="195" y="190" text-anchor="middle" font-size="14">Peripheral 확인</text>
<rect x="380" y="115" width="230" height="105" rx="12" fill="#fff7ed" stroke="#111827"/><text x="495" y="158" text-anchor="middle" font-size="18">Parameter Write</text><text x="495" y="190" text-anchor="middle" font-size="14">Bias / Scale / ZP</text>
<rect x="680" y="115" width="230" height="105" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="795" y="158" text-anchor="middle" font-size="18">Input Write</text><text x="795" y="190" text-anchor="middle" font-size="14">ACC_IN0..7</text>
<rect x="980" y="115" width="230" height="105" rx="12" fill="#faf5ff" stroke="#111827"/><text x="1095" y="158" text-anchor="middle" font-size="18">CONTROL.START</text><text x="1095" y="190" text-anchor="middle" font-size="14">W1P</text>

<rect x="230" y="360" width="250" height="115" rx="12" fill="#f8fafc" stroke="#111827"/><text x="355" y="405" text-anchor="middle" font-size="18">STATUS Poll</text><text x="355" y="440" text-anchor="middle" font-size="14">DONE Sticky</text>
<rect x="540" y="360" width="250" height="115" rx="12" fill="#eef6ff" stroke="#111827"/><text x="665" y="405" text-anchor="middle" font-size="18">OUT_CH0/1 Read</text><text x="665" y="440" text-anchor="middle" font-size="14">packed int8</text>
<rect x="850" y="360" width="250" height="115" rx="12" fill="#f0fdf4" stroke="#111827"/><text x="975" y="405" text-anchor="middle" font-size="18">Result Check</text><text x="975" y="440" text-anchor="middle" font-size="14">PASS / FAIL</text>
</g>

<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="310" y1="168" x2="380" y2="168"/>
<line x1="610" y1="168" x2="680" y2="168"/>
<line x1="910" y1="168" x2="980" y2="168"/>
<path d="M1095 220 L1095 285 L355 285 L355 360" fill="none"/>
<line x1="480" y1="418" x2="540" y2="418"/>
<line x1="790" y1="418" x2="850" y2="418"/>
</g>

<text x="660" y="555" text-anchor="middle" font-family="sans-serif" font-size="16">SoC 31은 Polling 방식으로 완성하고, 다음 단계에서 DONE Interrupt로 확장한다.</text>
</svg>