<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
<rect width="1320" height="760" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">SoC 31 · NPU Register Map</text>

<g font-family="sans-serif" font-size="16">
<rect x="120" y="100" width="1080" height="55" fill="#eef6ff" stroke="#111827"/>
<text x="180" y="135" font-weight="bold">Offset</text><text x="330" y="135" font-weight="bold">Register</text><text x="620" y="135" font-weight="bold">Access</text><text x="760" y="135" font-weight="bold">Meaning</text>

<rect x="120" y="155" width="1080" height="55" fill="#fff" stroke="#111827"/><text x="180" y="190">0x00</text><text x="330" y="190">CONTROL</text><text x="620" y="190">W1P</text><text x="760" y="190">START / CLEAR_DONE / CLEAR_ERROR</text>
<rect x="120" y="210" width="1080" height="55" fill="#f8fafc" stroke="#111827"/><text x="180" y="245">0x04</text><text x="330" y="245">STATUS</text><text x="620" y="245">RO</text><text x="760" y="245">BUSY / DONE / ERROR / SATURATED</text>
<rect x="120" y="265" width="1080" height="55" fill="#fff" stroke="#111827"/><text x="180" y="300">0x08</text><text x="330" y="300">VERSION</text><text x="620" y="300">RO</text><text x="760" y="300">0x00010000</text>
<rect x="120" y="320" width="1080" height="55" fill="#f8fafc" stroke="#111827"/><text x="180" y="355">0x0C</text><text x="330" y="355">SAT_COUNT</text><text x="620" y="355">RO</text><text x="760" y="355">int8 saturation 횟수</text>
<rect x="120" y="375" width="1080" height="55" fill="#fff" stroke="#111827"/><text x="180" y="410">0x10~0x20</text><text x="330" y="410">PARAMETERS</text><text x="620" y="410">RW</text><text x="760" y="410">Bias / Scale / Zero Point</text>
<rect x="120" y="430" width="1080" height="55" fill="#f8fafc" stroke="#111827"/><text x="180" y="465">0x40~0x5C</text><text x="330" y="465">ACC_IN0..7</text><text x="620" y="465">RW</text><text x="760" y="465">CH0/CH1 int32 input 8개</text>
<rect x="120" y="485" width="1080" height="55" fill="#fff" stroke="#111827"/><text x="180" y="520">0x60</text><text x="330" y="520">OUT_CH0</text><text x="620" y="520">RO</text><text x="760" y="520">signed int8 ×4 packed</text>
<rect x="120" y="540" width="1080" height="55" fill="#f8fafc" stroke="#111827"/><text x="180" y="575">0x64</text><text x="330" y="575">OUT_CH1</text><text x="620" y="575">RO</text><text x="760" y="575">signed int8 ×4 packed</text>
<rect x="120" y="595" width="1080" height="55" fill="#fff" stroke="#111827"/><text x="180" y="630">0x68</text><text x="330" y="630">CYCLE_COUNT</text><text x="620" y="630">RO</text><text x="760" y="630">START 후 Accelerator Busy cycle count</text>
</g>
<text x="660" y="705" text-anchor="middle" font-family="sans-serif" font-size="15">Base Address는 시스템 주소 공간에서 별도 할당하며 위 값들은 Peripheral 내부 Offset이다.</text>
</svg>