<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="570" viewBox="0 0 1260 570">
<rect width="1260" height="570" fill="white"/>
<text x="630" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">CustomDrv_RunBlocking() 내부 흐름</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<g font-family="sans-serif" font-size="17">
<rect x="45" y="155" width="165" height="90" rx="10" fill="#eef6ff" stroke="#111827"/><text x="128" y="190" text-anchor="middle">Clear STATUS</text><text x="128" y="220" text-anchor="middle">Clear IRQ</text>
<rect x="250" y="155" width="165" height="90" rx="10" fill="#eef6ff" stroke="#111827"/><text x="333" y="190" text-anchor="middle">Configure</text><text x="333" y="220" text-anchor="middle">Enable + Mode</text>
<rect x="455" y="155" width="165" height="90" rx="10" fill="#fff7ed" stroke="#111827"/><text x="538" y="190" text-anchor="middle">Start</text><text x="538" y="220" text-anchor="middle">DATA_IN + W1P</text>
<rect x="660" y="155" width="165" height="90" rx="10" fill="#f3f4f6" stroke="#111827"/><text x="743" y="190" text-anchor="middle">WaitDone</text><text x="743" y="220" text-anchor="middle">Poll STATUS</text>
<rect x="865" y="155" width="165" height="90" rx="10" fill="#f0fdf4" stroke="#111827"/><text x="948" y="190" text-anchor="middle">GetResult</text><text x="948" y="220" text-anchor="middle">DATA_OUT</text>
<rect x="1070" y="155" width="145" height="90" rx="10" fill="#faf5ff" stroke="#111827"/><text x="1143" y="190" text-anchor="middle">Return</text><text x="1143" y="220" text-anchor="middle">Status Code</text>
</g>
<g stroke="#111827" stroke-width="3" marker-end="url(#a)">
<line x1="210" y1="200" x2="250" y2="200"/><line x1="415" y1="200" x2="455" y2="200"/>
<line x1="620" y1="200" x2="660" y2="200"/><line x1="825" y1="200" x2="865" y2="200"/>
<line x1="1030" y1="200" x2="1070" y2="200"/>
</g>
<rect x="320" y="350" width="620" height="120" rx="12" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="630" y="388" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">WaitDone 결과 분기</text>
<text x="630" y="425" text-anchor="middle" font-family="sans-serif" font-size="17"><tspan x="630" y="425">DONE → 성공 · ERROR → CUSTOMDRV_ERR_HW</tspan><tspan x="630" y="452">PollLimit 초과 → CUSTOMDRV_ERR_TIMEOUT</tspan></text>
<text x="630" y="525" text-anchor="middle" font-family="sans-serif" font-size="16">성공해도 DONE/IRQ는 자동 Clear하지 않아 호출자가 상태를 확인할 수 있다.</text>
</svg>