<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="510" viewBox="0 0 1180 510">
<rect width="1180" height="510" fill="white"/>
<text x="590" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Driver Error Model</text>
<g font-family="sans-serif" font-size="18">
<rect x="120" y="90" width="940" height="50" fill="#eef6ff" stroke="#111827"/><text x="160" y="121">0</text><text x="270" y="121">CUSTOMDRV_OK</text><text x="570" y="121">정상 완료</text>
<rect x="120" y="140" width="940" height="50" fill="#f8fafc" stroke="#111827"/><text x="160" y="171">-1</text><text x="270" y="171">ERR_PARAM</text><text x="570" y="171">NULL, Mode, PollLimit, Alignment 오류</text>
<rect x="120" y="190" width="940" height="50" fill="#f8fafc" stroke="#111827"/><text x="160" y="221">-2</text><text x="270" y="221">ERR_NOT_READY</text><text x="570" y="221">Initialize 전 API 호출</text>
<rect x="120" y="240" width="940" height="50" fill="#fff7ed" stroke="#111827"/><text x="160" y="271">-3/-4</text><text x="270" y="271">ERR_ID / ERR_VERSION</text><text x="570" y="271">다른 Hardware 또는 Version 불일치</text>
<rect x="120" y="290" width="940" height="50" fill="#fef2f2" stroke="#111827"/><text x="160" y="321">-5</text><text x="270" y="321">ERR_BUSY</text><text x="570" y="321">작업 중 새 Start 요청</text>
<rect x="120" y="340" width="940" height="50" fill="#fef2f2" stroke="#111827"/><text x="160" y="371">-6</text><text x="270" y="371">ERR_HW</text><text x="570" y="371">STATUS.ERROR 검출</text>
<rect x="120" y="390" width="940" height="50" fill="#fef2f2" stroke="#111827"/><text x="160" y="421">-7</text><text x="270" y="421">ERR_TIMEOUT</text><text x="570" y="421">지정 Poll 횟수 안에 DONE 미발생</text>
</g>
<text x="590" y="477" text-anchor="middle" font-family="sans-serif" font-size="16">Driver가 실패 원인을 하나의 XST_FAILURE로 뭉개지 않고 호출자에게 구분하여 전달</text>
</svg>