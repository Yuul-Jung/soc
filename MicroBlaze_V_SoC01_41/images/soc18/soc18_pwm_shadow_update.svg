<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590">
<rect width="1280" height="590" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">PWM Shadow → UPDATE → Active Configuration</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="60" y="135" width="260" height="260" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="190" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Software Shadow</text>
<text x="190" y="230" text-anchor="middle" font-family="sans-serif" font-size="17">PERIOD_SHADOW</text>
<text x="190" y="275" text-anchor="middle" font-family="sans-serif" font-size="17">DUTY_SHADOW</text>
<text x="190" y="320" text-anchor="middle" font-family="sans-serif" font-size="17">CONTROL</text>
<text x="190" y="365" text-anchor="middle" font-family="sans-serif" font-size="17">아직 출력 미변경</text>

<rect x="430" y="160" width="260" height="210" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="560" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">UPDATE W1P</text>
<text x="560" y="255" text-anchor="middle" font-family="sans-serif" font-size="17">period != 0 ?</text>
<text x="560" y="295" text-anchor="middle" font-family="sans-serif" font-size="17">duty &lt;= period ?</text>
<text x="560" y="335" text-anchor="middle" font-family="sans-serif" font-size="17">검증 후 Commit</text>

<rect x="800" y="135" width="260" height="260" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="930" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Active Configuration</text>
<text x="930" y="230" text-anchor="middle" font-family="sans-serif" font-size="17">active_period</text>
<text x="930" y="275" text-anchor="middle" font-family="sans-serif" font-size="17">active_duty</text>
<text x="930" y="320" text-anchor="middle" font-family="sans-serif" font-size="17">active_enable/invert</text>
<text x="930" y="365" text-anchor="middle" font-family="sans-serif" font-size="17">Legacy PWM Core 구동</text>

<line x1="320" y1="265" x2="430" y2="265" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="690" y1="265" x2="800" y2="265" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<path d="M560 370 L560 460 L190 460 L190 395" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
<text x="380" y="445" text-anchor="middle" font-family="sans-serif" font-size="16">Invalid → ERROR, 기존 Active 값 유지</text>
<text x="640" y="540" text-anchor="middle" font-family="sans-serif" font-size="16">Period와 Duty의 중간 상태가 출력에 노출되지 않도록 Commit 시점을 분리한다.</text>
</svg>