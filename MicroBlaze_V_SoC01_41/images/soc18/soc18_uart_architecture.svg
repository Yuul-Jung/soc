<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<rect width="1280" height="560" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">UART TX Controller IP</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="55" y="160" width="225" height="190" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="168" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">AXI4-Lite Adapter</text>
<text x="168" y="250" text-anchor="middle" font-family="sans-serif" font-size="16">AW/W/B + AR/R</text>
<text x="168" y="295" text-anchor="middle" font-family="sans-serif" font-size="16">wr/rd offset</text>

<rect x="350" y="125" width="250" height="260" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="475" y="170" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">UART Register Bank</text>
<text x="475" y="215" text-anchor="middle" font-family="sans-serif" font-size="16">CONTROL</text>
<text x="475" y="250" text-anchor="middle" font-family="sans-serif" font-size="16">TX_DATA</text>
<text x="475" y="285" text-anchor="middle" font-family="sans-serif" font-size="16">COMMAND.SEND</text>
<text x="475" y="320" text-anchor="middle" font-family="sans-serif" font-size="16">STATUS / IRQ_STATUS</text>
<text x="475" y="355" text-anchor="middle" font-family="sans-serif" font-size="16">BAUD_DIV</text>

<rect x="675" y="145" width="250" height="220" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="800" y="190" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">UART Adapter</text>
<text x="800" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">Enable / Busy Guard</text>
<text x="800" y="275" text-anchor="middle" font-family="sans-serif" font-size="16">DONE Pulse Latch</text>
<text x="800" y="315" text-anchor="middle" font-family="sans-serif" font-size="16">ERROR Policy</text>

<rect x="1000" y="160" width="225" height="190" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1113" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Legacy UART TX</text>
<text x="1113" y="250" text-anchor="middle" font-family="sans-serif" font-size="16">start + byte</text>
<text x="1113" y="290" text-anchor="middle" font-family="sans-serif" font-size="16">busy + done pulse</text>
<text x="1113" y="325" text-anchor="middle" font-family="sans-serif" font-size="16">serial tx_o</text>

<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="280" y1="255" x2="350" y2="255"/>
<line x1="600" y1="255" x2="675" y2="255"/>
<line x1="925" y1="255" x2="1000" y2="255"/>
</g>
<text x="640" y="500" text-anchor="middle" font-family="sans-serif" font-size="16">PG142의 RX/TX FIFO형 Register 구조와는 다르지만, Memory-Mapped UART라는 동일한 분리 원칙을 따른다.</text>
</svg>