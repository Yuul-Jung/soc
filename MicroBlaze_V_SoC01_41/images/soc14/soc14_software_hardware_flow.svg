<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="570" viewBox="0 0 1260 570">
<rect width="1260" height="570" fill="white"/>
<text x="630" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Software → Controller → Software</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<g font-family="sans-serif">
<rect x="65" y="130" width="210" height="110" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="170" y="175" text-anchor="middle" font-size="19" font-weight="bold">1. CONTROL</text>
<text x="170" y="210" text-anchor="middle" font-size="16">enable + mode</text>
<rect x="325" y="130" width="210" height="110" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="430" y="175" text-anchor="middle" font-size="19" font-weight="bold">2. DATA_IN</text>
<text x="430" y="210" text-anchor="middle" font-size="16">input value</text>
<rect x="585" y="130" width="210" height="110" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="690" y="175" text-anchor="middle" font-size="19" font-weight="bold">3. COMMAND</text>
<text x="690" y="210" text-anchor="middle" font-size="16">START W1P</text>
<rect x="845" y="130" width="210" height="110" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="950" y="175" text-anchor="middle" font-size="19" font-weight="bold">4. Controller</text>
<text x="950" y="210" text-anchor="middle" font-size="16">busy → done</text>
<rect x="520" y="350" width="220" height="110" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="630" y="395" text-anchor="middle" font-size="19" font-weight="bold">5. STATUS Poll</text>
<text x="630" y="430" text-anchor="middle" font-size="16">done / error</text>
<rect x="830" y="350" width="220" height="110" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="940" y="395" text-anchor="middle" font-size="19" font-weight="bold">6. DATA_OUT</text>
<text x="940" y="430" text-anchor="middle" font-size="16">result read</text>
</g>
<g stroke="#111827" stroke-width="3" marker-end="url(#a)">
<line x1="275" y1="185" x2="325" y2="185"/>
<line x1="535" y1="185" x2="585" y2="185"/>
<line x1="795" y1="185" x2="845" y2="185"/>
<path d="M950 240 L950 300 L630 300 L630 350" fill="none"/>
<line x1="740" y1="405" x2="830" y2="405"/>
</g>
<text x="630" y="520" text-anchor="middle" font-family="sans-serif" font-size="16">IRQ_STATUS는 STATUS와 독립적으로 Latched Event를 보존하며 W1C로 Clear한다.</text>
</svg>