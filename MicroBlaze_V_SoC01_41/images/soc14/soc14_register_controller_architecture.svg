<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650">
<rect width="1320" height="650" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Register Bank ↔ RTL Controller</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="60" y="220" width="220" height="160" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">MicroBlaze V</text>
<text x="170" y="305" text-anchor="middle" font-family="sans-serif" font-size="17">AXI4-Lite Master</text>
<text x="170" y="340" text-anchor="middle" font-family="sans-serif" font-size="17">Software Driver</text>

<rect x="350" y="190" width="250" height="220" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="475" y="235" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">AXI Adapter</text>
<text x="475" y="278" text-anchor="middle" font-family="sans-serif" font-size="17">AW/W/B</text>
<text x="475" y="312" text-anchor="middle" font-family="sans-serif" font-size="17">AR/R</text>
<text x="475" y="350" text-anchor="middle" font-family="sans-serif" font-size="17">wr_en / rd_offset</text>

<rect x="675" y="145" width="270" height="315" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="810" y="190" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Register Bank</text>
<text x="810" y="235" text-anchor="middle" font-family="sans-serif" font-size="17">CONTROL / COMMAND</text>
<text x="810" y="270" text-anchor="middle" font-family="sans-serif" font-size="17">DATA_IN</text>
<text x="810" y="330" text-anchor="middle" font-family="sans-serif" font-size="17">STATUS / DATA_OUT</text>
<text x="810" y="365" text-anchor="middle" font-family="sans-serif" font-size="17">IRQ_STATUS</text>
<text x="810" y="415" text-anchor="middle" font-family="sans-serif" font-size="16">Bus ↔ Hardware 의미 변환 경계</text>

<rect x="1020" y="165" width="245" height="275" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1142" y="210" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">RTL Controller</text>
<text x="1142" y="250" text-anchor="middle" font-family="sans-serif" font-size="16">enable / mode</text>
<text x="1142" y="282" text-anchor="middle" font-family="sans-serif" font-size="16">start / clear</text>
<text x="1142" y="314" text-anchor="middle" font-family="sans-serif" font-size="16">data_in</text>
<text x="1142" y="356" text-anchor="middle" font-family="sans-serif" font-size="16">busy / done / error</text>
<text x="1142" y="388" text-anchor="middle" font-family="sans-serif" font-size="16">data_out / irq events</text>

<line x1="280" y1="300" x2="350" y2="300" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="600" y1="300" x2="675" y2="300" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<line x1="945" y1="245" x2="1020" y2="245" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
<text x="982" y="228" text-anchor="middle" font-family="sans-serif" font-size="15">Control</text>
<line x1="1020" y1="360" x2="945" y2="360" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/>
<text x="982" y="345" text-anchor="middle" font-family="sans-serif" font-size="15">Status/Event</text>

<text x="660" y="585" text-anchor="middle" font-family="sans-serif" font-size="17">Controller는 AXI Signal을 모르고, Register Bank는 처리 알고리즘을 모른다.</text>
</svg>