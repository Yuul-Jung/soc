<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
<rect width="1180" height="560" fill="white"/>
<text x="590" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">example_processing_controller FSM</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<circle cx="320" cy="270" r="120" fill="#eef6ff" stroke="#111827" stroke-width="3"/>
<text x="320" y="235" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">IDLE</text>
<text x="320" y="275" text-anchor="middle" font-family="sans-serif" font-size="17">busy = 0</text>
<text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="16">START + enable</text>

<circle cx="860" cy="270" r="120" fill="#fff7ed" stroke="#111827" stroke-width="3"/>
<text x="860" y="235" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">RUN</text>
<text x="860" y="275" text-anchor="middle" font-family="sans-serif" font-size="17">busy = 1</text>
<text x="860" y="310" text-anchor="middle" font-family="sans-serif" font-size="16">fixed processing cycles</text>

<path d="M440 235 C560 150 620 150 740 235" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="590" y="145" text-anchor="middle" font-family="sans-serif" font-size="17">START &amp;&amp; enable</text>
<text x="590" y="174" text-anchor="middle" font-family="sans-serif" font-size="15">Latch mode + data</text>

<path d="M740 310 C620 400 560 400 440 310" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<text x="590" y="422" text-anchor="middle" font-family="sans-serif" font-size="17">cycles_left → 0</text>
<text x="590" y="450" text-anchor="middle" font-family="sans-serif" font-size="15">data_out + done + irq_done_event</text>

<path d="M245 150 C110 70 90 280 205 335" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
<text x="115" y="145" text-anchor="middle" font-family="sans-serif" font-size="15">START while disabled</text>
<text x="115" y="170" text-anchor="middle" font-family="sans-serif" font-size="15">error event</text>

<path d="M940 155 C1090 90 1100 310 975 345" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
<text x="1060" y="145" text-anchor="middle" font-family="sans-serif" font-size="15">START while busy</text>
<text x="1060" y="170" text-anchor="middle" font-family="sans-serif" font-size="15">error, original run continues</text>
</svg>