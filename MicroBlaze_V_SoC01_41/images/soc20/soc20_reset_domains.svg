<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570">
<rect width="1240" height="570" fill="white"/>
<text x="620" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Reset: Async Assert / Sync Deassert</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="60" y="200" width="220" height="130" rx="12" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="170" y="245" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">global_resetn</text>
<text x="170" y="285" text-anchor="middle" font-family="sans-serif" font-size="16">공통 비동기 Reset</text>

<rect x="390" y="105" width="300" height="150" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="540" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">AXI Domain Reset Sync</text>
<text x="540" y="190" text-anchor="middle" font-family="sans-serif" font-size="16">dest_clk = s_axi_aclk</text>
<text x="540" y="222" text-anchor="middle" font-family="sans-serif" font-size="16">→ axi_resetn</text>

<rect x="390" y="325" width="300" height="150" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="540" y="370" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Functional Reset Sync</text>
<text x="540" y="410" text-anchor="middle" font-family="sans-serif" font-size="16">dest_clk = func_clk</text>
<text x="540" y="442" text-anchor="middle" font-family="sans-serif" font-size="16">→ func_resetn</text>

<rect x="820" y="105" width="330" height="150" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="985" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">AXI Logic</text>
<text x="985" y="190" text-anchor="middle" font-family="sans-serif" font-size="16">Reset Assertion: 즉시</text>
<text x="985" y="222" text-anchor="middle" font-family="sans-serif" font-size="16">Release: AXI Clock에 동기</text>

<rect x="820" y="325" width="330" height="150" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="985" y="370" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Functional Logic</text>
<text x="985" y="410" text-anchor="middle" font-family="sans-serif" font-size="16">Reset Assertion: 즉시</text>
<text x="985" y="442" text-anchor="middle" font-family="sans-serif" font-size="16">Release: Functional Clock에 동기</text>

<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="280" y1="245" x2="390" y2="180"/>
<line x1="280" y1="285" x2="390" y2="400"/>
<line x1="690" y1="180" x2="820" y2="180"/>
<line x1="690" y1="400" x2="820" y2="400"/>
</g>
<text x="620" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">Reset 해제는 각 Domain의 Clock Edge에 맞춰야 Recovery/Removal 위험을 줄일 수 있다.</text>
</svg>