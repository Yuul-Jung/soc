<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="640" viewBox="0 0 1340 640">
<rect width="1340" height="640" fill="white"/>
<text x="670" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">SoC 19 Bridge의 Dual-Clock 확장</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="45" y="115" width="330" height="390" rx="16" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="210" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">AXI Clock Domain</text>
<text x="210" y="205" text-anchor="middle" font-family="sans-serif" font-size="16">AXI4-Lite</text>
<text x="210" y="245" text-anchor="middle" font-family="sans-serif" font-size="16">Control / Status Bridge</text>
<text x="210" y="300" text-anchor="middle" font-family="sans-serif" font-size="16">CONTROL + IN_DATA</text>
<text x="210" y="340" text-anchor="middle" font-family="sans-serif" font-size="16">OUT_DATA</text>
<text x="210" y="390" text-anchor="middle" font-family="sans-serif" font-size="16">idle/busy sync flags</text>
<text x="210" y="455" text-anchor="middle" font-family="sans-serif" font-size="16">axi_resetn</text>

<rect x="455" y="115" width="420" height="390" rx="16" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="665" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">CDC Adapter</text>
<text x="665" y="215" text-anchor="middle" font-family="sans-serif" font-size="17">64-bit Input Packet</text>
<text x="665" y="248" text-anchor="middle" font-family="sans-serif" font-size="15">{CONTROL, IN_DATA}</text>
<text x="665" y="292" text-anchor="middle" font-family="sans-serif" font-size="16">XPM_CDC_HANDSHAKE</text>
<text x="665" y="340" text-anchor="middle" font-family="sans-serif" font-size="17">32-bit Result Handshake</text>
<text x="665" y="385" text-anchor="middle" font-family="sans-serif" font-size="17">Single-bit Status Sync</text>
<text x="665" y="435" text-anchor="middle" font-family="sans-serif" font-size="16">Post-Reset Settle Guard</text>

<rect x="955" y="115" width="340" height="390" rx="16" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1125" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Functional Clock Domain</text>
<text x="1125" y="210" text-anchor="middle" font-family="sans-serif" font-size="16">packet_data / valid / ready</text>
<text x="1125" y="260" text-anchor="middle" font-family="sans-serif" font-size="16">Functional Core</text>
<text x="1125" y="310" text-anchor="middle" font-family="sans-serif" font-size="16">result / valid / ready</text>
<text x="1125" y="365" text-anchor="middle" font-family="sans-serif" font-size="16">idle / busy</text>
<text x="1125" y="455" text-anchor="middle" font-family="sans-serif" font-size="16">func_resetn</text>

<line x1="375" y1="285" x2="455" y2="285" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="875" y1="285" x2="955" y2="285" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="955" y1="350" x2="875" y2="350" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="455" y1="350" x2="375" y2="350" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="670" y="575" text-anchor="middle" font-family="sans-serif" font-size="16">관련 있는 Multi-bit 값은 하나의 Handshake Payload로 묶어 같은 Snapshot으로 전달한다.</text>
</svg>