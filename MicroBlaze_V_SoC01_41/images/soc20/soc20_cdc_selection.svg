<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="690" viewBox="0 0 1320 690">
<rect width="1320" height="690" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">CDC 기법 선택</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="480" y="80" width="360" height="80" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="660" y="111" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold"><tspan x="660" y="111">Clock Domain을 넘는</tspan><tspan x="660" y="140">신호는 무엇인가?</tspan></text>

<g font-family="sans-serif">
<rect x="60" y="235" width="210" height="125" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="165" y="275" text-anchor="middle" font-size="18" font-weight="bold">1-bit Level</text>
<text x="165" y="310" text-anchor="middle" font-size="15">enable / busy / flag</text>
<text x="165" y="338" text-anchor="middle" font-size="15">XPM_CDC_SINGLE</text>

<rect x="315" y="235" width="210" height="125" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="420" y="275" text-anchor="middle" font-size="18" font-weight="bold">Pulse / Event</text>
<text x="420" y="310" text-anchor="middle" font-size="15">start / done pulse</text>
<text x="420" y="338" text-anchor="middle" font-size="15">XPM_CDC_PULSE</text>

<rect x="570" y="235" width="210" height="125" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="675" y="275" text-anchor="middle" font-size="18" font-weight="bold">Coherent Bus</text>
<text x="675" y="310" text-anchor="middle" font-size="15">control + data</text>
<text x="675" y="338" text-anchor="middle" font-size="15">XPM_CDC_HANDSHAKE</text>

<rect x="825" y="235" width="210" height="125" rx="12" fill="#fef2f2" stroke="#111827" stroke-width="2"/>
<text x="930" y="275" text-anchor="middle" font-size="18" font-weight="bold">Counter / Pointer</text>
<text x="930" y="310" text-anchor="middle" font-size="15">연속 변화 Binary</text>
<text x="930" y="338" text-anchor="middle" font-size="15">XPM_CDC_GRAY</text>

<rect x="1080" y="235" width="180" height="125" rx="12" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="1170" y="275" text-anchor="middle" font-size="18" font-weight="bold">High Rate</text>
<text x="1170" y="310" text-anchor="middle" font-size="15">Stream / Queue</text>
<text x="1170" y="338" text-anchor="middle" font-size="15">XPM_FIFO_ASYNC</text>
</g>

<g stroke="#111827" stroke-width="3" marker-end="url(#a)">
<line x1="660" y1="160" x2="165" y2="235"/>
<line x1="660" y1="160" x2="420" y2="235"/>
<line x1="660" y1="160" x2="675" y2="235"/>
<line x1="660" y1="160" x2="930" y2="235"/>
<line x1="660" y1="160" x2="1170" y2="235"/>
</g>

<rect x="240" y="455" width="840" height="125" rx="14" fill="#fff" stroke="#111827" stroke-width="2"/>
<text x="660" y="495" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Reset은 별도 문제</text>
<text x="660" y="530" text-anchor="middle" font-family="sans-serif" font-size="17">Async Assert / Sync Deassert → XPM_CDC_ASYNC_RST</text>
<text x="660" y="558" text-anchor="middle" font-family="sans-serif" font-size="16">각 Clock Domain마다 Reset Synchronizer를 둔다.</text>

<text x="660" y="640" text-anchor="middle" font-family="sans-serif" font-size="17">Binary Bus에 Bit별 2-FF를 붙이는 방식은 Coherency를 보장하지 않는다.</text>
</svg>