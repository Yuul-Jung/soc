<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600">
<rect width="1320" height="600" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">AXI Control / Status Bridge</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="55" y="160" width="220" height="230" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="165" y="205" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">MicroBlaze V</text>
<text x="165" y="250" text-anchor="middle" font-family="sans-serif" font-size="17">AXI4-Lite</text>
<text x="165" y="290" text-anchor="middle" font-family="sans-serif" font-size="16">Register Read/Write</text>
<text x="165" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">Driver API</text>

<rect x="345" y="120" width="290" height="310" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="490" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Control / Status Bridge</text>
<text x="490" y="215" text-anchor="middle" font-family="sans-serif" font-size="16">CONTROL / CORE_STATUS</text>
<text x="490" y="255" text-anchor="middle" font-family="sans-serif" font-size="16">IN_DATA + SUBMIT</text>
<text x="490" y="295" text-anchor="middle" font-family="sans-serif" font-size="16">OUT_DATA + POP</text>
<text x="490" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">EVENT_STATUS / IRQ</text>
<text x="490" y="385" text-anchor="middle" font-family="sans-serif" font-size="16">1-word Input/Output Buffer</text>

<rect x="720" y="120" width="275" height="310" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="858" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Standard Endpoint</text>
<text x="858" y="220" text-anchor="middle" font-family="monospace" font-size="16">control / status</text>
<text x="858" y="265" text-anchor="middle" font-family="monospace" font-size="16">in_data / valid / ready</text>
<text x="858" y="310" text-anchor="middle" font-family="monospace" font-size="16">out_data / valid / ready</text>
<text x="858" y="365" text-anchor="middle" font-family="sans-serif" font-size="16">Bus-independent</text>

<rect x="1080" y="160" width="190" height="230" rx="12" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1175" y="205" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Functional RTL</text>
<text x="1175" y="250" text-anchor="middle" font-family="sans-serif" font-size="16">UART</text>
<text x="1175" y="285" text-anchor="middle" font-family="sans-serif" font-size="16">DSP / FFT</text>
<text x="1175" y="320" text-anchor="middle" font-family="sans-serif" font-size="16">NPU Datapath</text>
<text x="1175" y="355" text-anchor="middle" font-family="sans-serif" font-size="16">Custom Controller</text>

<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="275" y1="275" x2="345" y2="275"/>
<line x1="635" y1="275" x2="720" y2="275"/>
<line x1="995" y1="275" x2="1080" y2="275"/>
</g>
<text x="660" y="535" text-anchor="middle" font-family="sans-serif" font-size="17">AXI Protocol과 기능 RTL 사이에 재사용 가능한 의미 변환 경계를 둔다.</text>
</svg>