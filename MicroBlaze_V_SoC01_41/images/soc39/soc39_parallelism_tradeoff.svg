<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="630" viewBox="0 0 1360 630">
<rect width="1360" height="630" fill="white"/>
<text x="680" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Parallelism Trade-off</text>

<rect x="90" y="120" width="350" height="390" rx="16" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="265" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Speed</text>
<text x="265" y="240" text-anchor="middle" font-family="sans-serif" font-size="17">Requant 14 → 8</text>
<text x="265" y="290" text-anchor="middle" font-family="sans-serif" font-size="17">Total 28 → 22</text>
<text x="265" y="350" text-anchor="middle" font-family="sans-serif" font-size="17">Upper throughput +27.3%</text>

<rect x="505" y="120" width="350" height="390" rx="16" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="680" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Resource</text>
<text x="680" y="240" text-anchor="middle" font-family="sans-serif" font-size="17">Core instance 1 → 4</text>
<text x="680" y="290" text-anchor="middle" font-family="sans-serif" font-size="17">DSP/LUT/FF 증가 가능</text>
<text x="680" y="350" text-anchor="middle" font-family="sans-serif" font-size="17">실제 값은 Synthesis Report</text>

<rect x="920" y="120" width="350" height="390" rx="16" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1095" y="175" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Power / Timing</text>
<text x="1095" y="240" text-anchor="middle" font-family="sans-serif" font-size="17">Switching 증가 가능</text>
<text x="1095" y="290" text-anchor="middle" font-family="sans-serif" font-size="17">Placement 복잡도 증가 가능</text>
<text x="1095" y="350" text-anchor="middle" font-family="sans-serif" font-size="17">Post-Route 비교 필요</text>

<text x="680" y="575" text-anchor="middle" font-family="sans-serif" font-size="17">Cycle 감소만으로 채택하지 않고 Function · Timing · Resource · Power를 함께 판단한다.</text>
</svg>