<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610">
<rect width="1240" height="610" fill="white"/>
<text x="620" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">WNS와 TNS를 같이 보는 이유</text>

<g font-family="sans-serif">
<rect x="70" y="110" width="500" height="375" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="320" y="155" text-anchor="middle" font-size="22" font-weight="bold">WNS · Worst Negative Slack</text>
<text x="125" y="215" font-size="17">가장 나쁜 Setup Path의 Slack</text>
<text x="125" y="260" font-size="16">예:</text>
<text x="185" y="260" font-size="16">Path A = -0.80 ns</text>
<text x="185" y="300" font-size="16">Path B = -0.35 ns</text>
<text x="185" y="340" font-size="16">Path C = +0.20 ns</text>
<text x="125" y="395" font-size="17">WNS → -0.80 ns</text>
<text x="125" y="445" font-size="16">Critical Path의 심각도를 먼저 본다.</text>

<rect x="670" y="110" width="500" height="375" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="920" y="155" text-anchor="middle" font-size="22" font-weight="bold">TNS · Total Negative Slack</text>
<text x="725" y="215" font-size="17">Failing Endpoint들의 최악 Slack 합</text>
<text x="725" y="260" font-size="16">위 예에서 개념적으로:</text>
<text x="785" y="305" font-size="16">-0.80 + -0.35</text>
<text x="785" y="345" font-size="16">→ 음수 누적</text>
<text x="725" y="395" font-size="17">위반이 얼마나 넓게 퍼졌는지 본다.</text>
<text x="725" y="445" font-size="16">모든 Setup Constraint 만족 시 TNS → 0 ns</text>
</g>

<text x="620" y="545" text-anchor="middle" font-family="sans-serif" font-size="17">먼저 각 Clock의 WNS를 개선하면 다수의 연관 Path가 함께 좋아져 TNS가 감소하는 경우가 많다.</text>
</svg>