<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640">
<rect width="1320" height="640" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Long Datapath → Pipeline</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<text x="80" y="110" font-family="sans-serif" font-size="20" font-weight="bold">Unpipelined</text>
<rect x="80" y="140" width="160" height="90" rx="10" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="160" y="195" text-anchor="middle" font-family="sans-serif" font-size="17">Input Reg</text>
<rect x="315" y="125" width="560" height="120" rx="10" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="595" y="170" text-anchor="middle" font-family="sans-serif" font-size="18">Op1 → Op2 → Op3 → Op4 → Op5 → Op6 → Op7 → Op8</text>
<text x="595" y="210" text-anchor="middle" font-family="sans-serif" font-size="16">한 Clock Period 안에 전체 Logic + Route Delay</text>
<rect x="950" y="140" width="160" height="90" rx="10" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="1030" y="195" text-anchor="middle" font-family="sans-serif" font-size="17">Output Reg</text>
<line x1="240" y1="185" x2="315" y2="185" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="875" y1="185" x2="950" y2="185" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="80" y="345" font-family="sans-serif" font-size="20" font-weight="bold">Pipelined</text>
<rect x="80" y="375" width="160" height="90" rx="10" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="160" y="430" text-anchor="middle" font-family="sans-serif" font-size="17">Input Reg</text>
<rect x="300" y="365" width="300" height="110" rx="10" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="450" y="410" text-anchor="middle" font-family="sans-serif" font-size="17">Op1 → Op2 → Op3 → Op4</text>
<text x="450" y="445" text-anchor="middle" font-family="sans-serif" font-size="15">Stage 1</text>
<rect x="650" y="375" width="150" height="90" rx="10" fill="#faf5ff" stroke="#111827" stroke-width="2"/>
<text x="725" y="430" text-anchor="middle" font-family="sans-serif" font-size="17">Pipeline Reg</text>
<rect x="850" y="365" width="300" height="110" rx="10" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="1000" y="410" text-anchor="middle" font-family="sans-serif" font-size="17">Op5 → Op6 → Op7 → Op8</text>
<text x="1000" y="445" text-anchor="middle" font-family="sans-serif" font-size="15">Stage 2</text>
<line x1="240" y1="420" x2="300" y2="420" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="600" y1="420" x2="650" y2="420" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
<line x1="800" y1="420" x2="850" y2="420" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>

<text x="660" y="555" text-anchor="middle" font-family="sans-serif" font-size="17">Pipeline은 Clock Period를 줄이기 쉬워지지만 Latency와 Valid 정렬 관리가 추가된다.</text>
<text x="660" y="595" text-anchor="middle" font-family="sans-serif" font-size="16">Throughput은 매 Clock 결과를 낼 수 있어도 최초 결과 Latency는 증가할 수 있다.</text>
</svg>