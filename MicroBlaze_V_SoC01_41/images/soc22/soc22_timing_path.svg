<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">
<rect width="1320" height="620" fill="white"/>
<text x="660" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold">Register-to-Register Timing Path</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>

<rect x="65" y="190" width="210" height="170" rx="14" fill="#eef6ff" stroke="#111827" stroke-width="2"/>
<text x="170" y="230" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Launch Register</text>
<text x="170" y="275" text-anchor="middle" font-family="sans-serif" font-size="16">Source FF</text>
<text x="170" y="315" text-anchor="middle" font-family="sans-serif" font-size="16">Clock-to-Q</text>

<rect x="365" y="145" width="345" height="260" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
<text x="538" y="190" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Data Path</text>
<text x="538" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">LUT / Carry / DSP / MUX</text>
<text x="538" y="280" text-anchor="middle" font-family="sans-serif" font-size="16">Cell Delay</text>
<text x="538" y="320" text-anchor="middle" font-family="sans-serif" font-size="16">Route Delay</text>
<text x="538" y="365" text-anchor="middle" font-family="sans-serif" font-size="16">Logic Levels / Fanout / Placement</text>

<rect x="800" y="190" width="210" height="170" rx="14" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
<text x="905" y="230" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Capture Register</text>
<text x="905" y="275" text-anchor="middle" font-family="sans-serif" font-size="16">Destination FF</text>
<text x="905" y="315" text-anchor="middle" font-family="sans-serif" font-size="16">Setup / Hold</text>

<rect x="1085" y="145" width="175" height="260" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="1173" y="190" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold">Clock Path</text>
<text x="1173" y="235" text-anchor="middle" font-family="sans-serif" font-size="15">Launch Edge</text>
<text x="1173" y="275" text-anchor="middle" font-family="sans-serif" font-size="15">Capture Edge</text>
<text x="1173" y="315" text-anchor="middle" font-family="sans-serif" font-size="15">Skew</text>
<text x="1173" y="355" text-anchor="middle" font-family="sans-serif" font-size="15">Uncertainty</text>

<g stroke="#111827" stroke-width="4" marker-end="url(#a)">
<line x1="275" y1="275" x2="365" y2="275"/>
<line x1="710" y1="275" x2="800" y2="275"/>
</g>

<text x="660" y="485" text-anchor="middle" font-family="sans-serif" font-size="18">Setup Slack = Required Time − Arrival Time</text>
<text x="660" y="525" text-anchor="middle" font-family="sans-serif" font-size="18">Hold Slack = Arrival Time − Required Time</text>
<text x="660" y="570" text-anchor="middle" font-family="sans-serif" font-size="16">Slack ≥ 0 → 해당 Timing Requirement 만족 · Slack &lt; 0 → 위반</text>
</svg>