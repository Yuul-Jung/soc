<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610">
<rect width="1280" height="610" fill="white"/>
<text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Main Loop + Timer Interrupt 동시 동작</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
<rect x="80" y="105" width="420" height="390" rx="12" fill="#eef6ff" stroke="#111827" stroke-width="2"/><text x="290" y="145" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Main Context</text>
<rect x="135" y="185" width="310" height="58" fill="white" stroke="#111827"/><text x="290" y="221" text-anchor="middle" font-family="sans-serif" font-size="17">GPIO SW[15:0] Read</text>
<rect x="135" y="275" width="310" height="58" fill="white" stroke="#111827"/><text x="290" y="311" text-anchor="middle" font-family="sans-serif" font-size="17">UART Non-blocking Poll</text>
<rect x="135" y="365" width="310" height="72" fill="white" stroke="#111827"/><text x="290" y="395" text-anchor="middle" font-family="sans-serif" font-size="17">Switch + UART + Timer State</text><text x="290" y="420" text-anchor="middle" font-family="sans-serif" font-size="17">→ GPIO LED Write</text>
<line x1="290" y1="243" x2="290" y2="275" stroke="#111827" stroke-width="3" marker-end="url(#a)"/><line x1="290" y1="333" x2="290" y2="365" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<rect x="745" y="115" width="430" height="300" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="2"/><text x="960" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Interrupt Context</text>
<rect x="800" y="200" width="320" height="65" fill="white" stroke="#111827"/><text x="960" y="239" text-anchor="middle" font-family="sans-serif" font-size="17">Timer expires every 0.5 s</text>
<rect x="800" y="310" width="320" height="65" fill="white" stroke="#111827"/><text x="960" y="337" text-anchor="middle" font-family="sans-serif" font-size="17">TimerCallback</text><text x="960" y="360" text-anchor="middle" font-family="monospace" font-size="16">interrupt_count++</text>
<line x1="960" y1="265" x2="960" y2="310" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<path d="M800 343 L610 343 L610 400 L445 400" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#a)"/><text x="620" y="325" text-anchor="middle" font-family="sans-serif" font-size="16">shared state</text>
<text x="640" y="565" text-anchor="middle" font-family="sans-serif" font-size="16">Timer ISR는 count만 변경하고 GPIO/UART 처리와 최종 상태 합성은 Main Context에서 수행</text>
</svg>
